<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electromagnetic Utilities - Storybook</title>
    
    <!-- External typography matching design_example.html -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- MathJax 4 Configuration & Script -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            startup: {
                ready: () => {
                    MathJax.startup.defaultReady();
                    if (typeof renderMath === 'function') {
                        renderMath();
                    }
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>

    <!-- Import transmission line utilities API -->
    <script src="./transmission_line.js"></script>

    <style>
        /* --- Color Variables & Typography matching design_example.html --- */
        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --success-dark: #059669;
            --accent-purple: #764ba2;
            --bg-color: #f1f5f9;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg-color: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            background-image: url('victorianBackground.png'), var(--bg-gradient);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            align-items: stretch;
            justify-content: center;
        }

        /* --- Storybook App Wrapper --- */
        .app-layout {
            display: flex;
            width: 100%;
            max-width: 1440px;
            gap: 24px;
            min-height: calc(100vh - 48px);
        }

        /* --- Left Sidebar / Navigation Panel --- */
        .sidebar {
            width: 320px;
            min-width: 280px;
            flex-shrink: 0;
            background-color: var(--card-bg-color);
            border-radius: 16px;
            box-shadow: var(--shadow-xl);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            animation: fadeIn 0.4s ease-in;
        }

        .sidebar-header {
            padding: 24px 20px 18px;
            border-bottom: 2px solid var(--border-color);
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.25em;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: left;
        }

        .sidebar-subtitle {
            margin: 6px 0 0;
            font-size: 0.82em;
            color: var(--text-muted);
            font-weight: 500;
        }

        .nav-list {
            list-style: none;
            margin: 0;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex: 1;
        }

        .nav-category {
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 10px 12px 4px;
        }

        .nav-item-btn {
            width: 100%;
            text-align: left;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 10px;
            font-family: var(--font-family);
            font-size: 0.92em;
            font-weight: 500;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-sm);
        }

        .nav-item-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateX(3px);
            background: linear-gradient(135deg, #fefefe 0%, #f8fafc 100%);
        }

        .nav-item-btn.active {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            border-color: var(--primary-color);
            font-weight: 600;
            box-shadow: var(--shadow-md);
            transform: translateX(3px);
        }

        .nav-badge {
            font-family: var(--font-mono);
            font-size: 0.72em;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-color);
            margin-left: auto;
            font-weight: 600;
        }

        .nav-item-btn.active .nav-badge {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .sidebar-footer {
            padding: 14px 18px;
            border-top: 1px solid var(--border-color);
            font-size: 0.78em;
            color: var(--text-muted);
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success-color);
            margin-right: 6px;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        /* --- Central Main Content Container --- */
        .content-panel {
            flex: 1;
            background-color: var(--card-bg-color);
            border-radius: 16px;
            box-shadow: var(--shadow-xl);
            padding: 36px 44px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Story Header --- */
        .story-header {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .story-header-titles h1 {
            text-align: left;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 8px 0;
            font-weight: 700;
            font-size: 2.1em;
            letter-spacing: -0.02em;
        }

        .story-tagline {
            color: var(--text-muted);
            font-size: 1.02em;
            margin: 0;
            font-weight: 500;
        }

        .page-counter-pill {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 14px;
            font-family: var(--font-mono);
            font-size: 0.82em;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* --- Section Styling & Story Elements --- */
        .section-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s ease;
        }

        .section-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
        }

        .section-card h2, .section-card h3 {
            text-align: left;
            margin-top: 0;
            color: var(--text-color);
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .section-card h2 {
            font-size: 1.3em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-card h3 {
            font-size: 1.05em;
            margin-bottom: 8px;
        }

        .section-card p {
            color: var(--text-color);
            line-height: 1.65;
            margin: 0 0 16px 0;
        }

        /* Callout note box styled like design_example context-display */
        .story-callout {
            background: linear-gradient(135deg, #fefefe 0%, #f8fafc 100%);
            border: 2px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 18px 0;
            font-style: italic;
            color: var(--text-color);
            line-height: 1.7;
            box-shadow: var(--shadow-sm);
        }

        /* Action Buttons */
        .primary-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            font-family: var(--font-family);
            font-size: 1.05em;
            font-weight: 600;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-md);
            letter-spacing: 0.01em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .primary-btn:active {
            transform: translateY(0);
            box-shadow: var(--shadow-sm);
        }

        .secondary-btn {
            padding: 10px 18px;
            border: 2px solid var(--border-color);
            background-color: white;
            cursor: pointer;
            border-radius: 8px;
            font-family: var(--font-family);
            font-weight: 600;
            color: var(--text-color);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .secondary-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        /* Output / Code display styled like design_example output-area */
        .code-display {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            min-height: 80px;
            white-space: pre-wrap;
            line-height: 1.7;
            color: var(--text-color);
            font-family: var(--font-mono);
            font-size: 0.9em;
            box-shadow: var(--shadow-sm);
            margin-top: 14px;
            overflow-x: auto;
        }

        /* Form Inputs matching design_example */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.88em;
            font-weight: 600;
            color: var(--text-color);
        }

        .text-input, .select-input {
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.95em;
            font-weight: 500;
            background: white;
            transition: all 0.2s ease;
        }

        .text-input:focus, .select-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* --- Prominent Deep Dive Collapsible Section --- */
        .deep-dive-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .deep-dive-card:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-md);
        }

        .deep-dive-card.is-expanded {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-lg);
        }

        .deep-dive-header {
            padding: 22px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: linear-gradient(135deg, #fcfdff 0%, #f6f8fc 100%);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        .deep-dive-header:hover {
            background: linear-gradient(135deg, #f8fafc 0%, #edf2f9 100%);
        }

        .deep-dive-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .deep-dive-badge-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .deep-dive-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 3px 9px;
            border-radius: 6px;
            background: rgba(99, 102, 241, 0.12);
            color: var(--primary-dark);
            font-family: var(--font-mono);
        }

        .deep-dive-reading-time {
            font-size: 0.8em;
            color: var(--text-muted);
            font-weight: 500;
        }

        .deep-dive-title {
            margin: 0;
            font-size: 1.2em;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: -0.01em;
        }

        .deep-dive-preview-desc {
            margin: 0;
            font-size: 0.9em;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .deep-dive-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px 24px;
            font-family: var(--font-family);
            font-size: 0.98em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        .deep-dive-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .deep-dive-btn.is-active {
            background: #ffffff;
            color: var(--primary-dark);
            border: 2px solid var(--primary-color);
            box-shadow: var(--shadow-sm);
        }

        .deep-dive-btn.is-active:hover {
            background: #f8fafc;
        }

        .deep-dive-icon {
            display: inline-block;
            transition: transform 0.3s ease;
            font-size: 0.8em;
        }

        .deep-dive-btn.is-active .deep-dive-icon {
            transform: rotate(180deg);
        }

        /* Smooth CSS grid expand/collapse */
        .deep-dive-panel {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .deep-dive-panel.open {
            grid-template-rows: 1fr;
        }

        .deep-dive-collapse-inner {
            min-height: 0;
            overflow: hidden;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .deep-dive-panel.open .deep-dive-collapse-inner {
            opacity: 1;
        }

        .deep-dive-body {
            padding: 26px 30px 30px;
            border-top: 1.5px solid var(--border-color);
            background: #ffffff;
            line-height: 1.85;
            color: var(--text-color);
        }

        .deep-dive-body h3 {
            font-size: 1.15em;
            font-weight: 700;
            color: var(--primary-dark);
            margin: 24px 0 10px 0;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .deep-dive-body h3:first-child {
            margin-top: 0;
        }

        .deep-dive-body p {
            margin: 0 0 16px 0;
            font-size: 0.98em;
            color: #334155;
            line-height: 1.8;
        }

        .deep-dive-formula-box {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1.5px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            border-radius: 8px;
            padding: 14px 18px;
            margin: 18px 0;
            color: var(--text-color);
            box-shadow: var(--shadow-sm);
        }

        .deep-dive-formula-box mjx-container {
            margin: 8px 0 !important;
            overflow-x: auto;
            overflow-y: hidden;
            max-width: 100%;
        }

        .deep-dive-formula-title {
            font-weight: 600;
            font-size: 0.82em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary-dark);
            margin-bottom: 8px;
            font-family: var(--font-mono);
        }

        .deep-dive-footer-close {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            justify-content: flex-end;
        }

        /* Story Controls Footer */
        .story-navigation-footer {
            margin-top: auto;
            padding-top: 24px;
            border-top: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Responsive tweaks */
        @media (max-width: 900px) {
            .app-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
            }
            .content-panel {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- Left Sidebar / Navigation Panel -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>TL Stories</h2>
                <p class="sidebar-subtitle">Electromagnetic Calculation Utilities</p>
            </div>

            <div class="nav-category">Story Pages</div>
            <ul class="nav-list" id="pages-list">
                <!-- Page items injected by script -->
            </ul>

            <div class="sidebar-footer">
                <div>
                    <span class="status-dot"></span>
                    <span id="api-status-text">transmission_line.js loaded</span>
                </div>
            </div>
        </aside>

        <!-- Central Main Content Panel -->
        <main class="content-panel" id="main-content-panel">
            <div class="story-header">
                <div class="story-header-titles">
                    <h1 id="page-title">Loading Page...</h1>
                    <p class="story-tagline" id="page-subtitle"></p>
                </div>
                <div class="page-counter-pill" id="page-counter">Page 1 of 5</div>
            </div>

            <!-- Injected Story Page Body -->
            <div id="page-body-container"></div>

            <!-- Bottom Story Navigation -->
            <div class="story-navigation-footer">
                <button class="secondary-btn" id="prev-btn" onclick="navigatePage(-1)">← Previous</button>
                <button class="primary-btn" id="next-btn" onclick="navigatePage(1)">Next →</button>
            </div>
        </main>
    </div>

    <script>
        // MathJax typesetting helper targeting story explanation elements
        function renderMath(targetElement) {
            if (window.MathJax && typeof window.MathJax.typesetPromise === 'function') {
                const elements = targetElement 
                    ? [targetElement] 
                    : document.querySelectorAll('#page-body-container .section-card, #page-body-container .deep-dive-card');
                window.MathJax.typesetPromise(elements).catch(err => {
                    console.warn('MathJax typesetting error:', err);
                });
            }
        }

        // Collapsible Deep-Dive State
        let isDeepDiveOpen = false;

        function toggleDeepDive() {
            isDeepDiveOpen = !isDeepDiveOpen;
            const card = document.getElementById('deep-dive-card');
            const panel = document.getElementById('deep-dive-panel');
            const btn = document.getElementById('deep-dive-toggle-btn');
            const btnLabel = document.getElementById('deep-dive-btn-label');

            if (!card || !panel || !btn) return;

            if (isDeepDiveOpen) {
                card.classList.add('is-expanded');
                panel.classList.add('open');
                btn.classList.add('is-active');
                btn.setAttribute('aria-expanded', 'true');
                if (btnLabel) btnLabel.textContent = 'Collapse Discussion';
            } else {
                card.classList.remove('is-expanded');
                panel.classList.remove('open');
                btn.classList.remove('is-active');
                btn.setAttribute('aria-expanded', 'false');
                if (btnLabel) btnLabel.textContent = 'Explore In-Depth Theory';
            }
        }

        function renderDeepDive(deepDive) {
            if (!deepDive) return '';
            return `
                <div class="deep-dive-card" id="deep-dive-card">
                    <div class="deep-dive-header" onclick="toggleDeepDive()">
                        <div class="deep-dive-meta">
                            <div class="deep-dive-badge-row">
                                <span class="deep-dive-pill">📖 Theory Deep Dive</span>
                                <span class="deep-dive-reading-time">${deepDive.readingTime || '5 min read'}</span>
                            </div>
                            <h3 class="deep-dive-title">${deepDive.title}</h3>
                            <p class="deep-dive-preview-desc">${deepDive.preview}</p>
                        </div>
                        <button class="deep-dive-btn" id="deep-dive-toggle-btn" aria-expanded="false" onclick="event.stopPropagation(); toggleDeepDive();">
                            <span id="deep-dive-btn-label">Explore In-Depth Theory</span>
                            <span class="deep-dive-icon">▼</span>
                        </button>
                    </div>
                    <div class="deep-dive-panel" id="deep-dive-panel">

                        <p>

                            $$b_n = \\frac{V_n - Z_0 I_n}{2\\sqrt{Z_0}} \\quad \\text{[Reflected Wave]}$$
                            $$\\begin{bmatrix} b_1 \\\\ b_2 \\end{bmatrix} = \\begin{bmatrix} S_{11} & S_{12} \\\\ S_{21} & S_{22} \\end{bmatrix} \\begin{bmatrix} a_1 \\\\ a_2 \\end{bmatrix}$$

                        <h3>2. Power Waves & Scattering Matrix Formulation</h3>
                        <p>
                            Scattering parameters (S-parameters) circumvent these issues by terminating all ports in a standard non-reflective reference impedance $Z_0$ 
                            (typically $50\\,\\Omega$). Instead of total terminal voltages and currents, we define normalized incident power waves $a_n$ and outgoing power waves $b_n$. 
                            The physical meaning of each parameter is direct and intuitive:
                        </p>

                            <li><strong>$S_{12} = b_1 / a_2 |_{a_1 = 0}$ (Reverse Isolation):</strong> Ratio of power transmitted backward from Port 2 to Port 1, representing internal device feedback.</li>
                            <li><strong>$S_{22} = b_2 / a_2 |_{a_1 = 0}$ (Output Reflection):</strong> Complex reflection coefficient looking into Port 2 with Port 1 terminated in $Z_0$.</li>
                        </ul>

            const zlReal = parseFloat(document.getElementById('zl-real').value);
            const zlImag = parseFloat(document.getElementById('zl-imag').value);
            const z0Mag = parseFloat(document.getElementById('z0-mag').value);
            const z0Phase = parseFloat(document.getElementById('z0-phase').value);

            const reflResult = globalThis.getTLRefelectionCoefficient(zlReal, zlImag, z0Mag, z0Phase);
            const swr = globalThis.getStandingWaveRatio_lossless_TL ? globalThis.getStandingWaveRatio_lossless_TL(reflResult.reflection) : 'N/A';

            document.getElementById('reflection-output').textContent = 
                `Reflection & Standing Wave Ratio:\n` +
                `------------------------------------\n` +
                `• Normalized Load zL: ${reflResult.normalized_load_impedance.real.toFixed(4)} + j(${reflResult.normalized_load_impedance.imag.toFixed(4)})\n` +
                `• Reflection |Γ|:     ${reflResult.reflection.magnitude.toFixed(4)}\n` +
                `• Reflection Phase:   ${(reflResult.reflection.theta * 180 / Math.PI).toFixed(3)}° (${reflResult.reflection.theta.toFixed(4)} rad)\n` +
                `• Reflection Complex: ${reflResult.reflection.real.toFixed(4)} + j(${reflResult.reflection.imag.toFixed(4)})\n` +
                `• SWR / VSWR:         ${typeof swr === 'number' ? swr.toFixed(4) : swr}`;
        }

        function calculateImpedanceAtDistance() {
            if (typeof globalThis.getImpedanceAtDistanceFromLoad_lossless_TL !== 'function') {
                document.getElementById('dist-output').textContent = 'Error: getImpedanceAtDistanceFromLoad_lossless_TL not defined.';
                return;
            }
            const d = parseFloat(document.getElementById('dist-d').value);
            const beta = parseFloat(document.getElementById('dist-beta').value);
            const z0 = parseFloat(document.getElementById('dist-z0').value);
            
            // Construct a sample reflection with magnitude 0.35 and 45 deg angle
            const sampleRefl = { magnitude: 0.35, theta: Math.PI / 4 };
            const zin = globalThis.getImpedanceAtDistanceFromLoad_lossless_TL(d, sampleRefl, z0, beta);

            document.getElementById('dist-output').textContent = 
                `Input Impedance at d = ${d} m:\n` +
                `------------------------------------\n` +
                `• Zin Real:      ${zin.real.toFixed(3)} Ω\n` +
                `• Zin Imag:      ${zin.imag.toFixed(3)} Ω\n` +
                `• Zin Magnitude: ${zin.magnitude.toFixed(3)} Ω\n` +
                `• Zin Phase:     ${(zin.theta * 180 / Math.PI).toFixed(2)}°`;
        }

        function testMatchingUtilities() {
            let output = `Impedance Matching Utilities Check:\n------------------------------------\n`;
            if (typeof globalThis.match_real_impedance_by_quarter_wave_length_lossless_TL === 'function') {
                const z0 = 50;
                const L = 2.5e-7;
                const f = 1e8;
                output += `• Quarter-wave transformer utility verified.\n`;
            }
            if (typeof globalThis.getRLCValsForImpedance === 'function') {
                const comp = globalThis.getRLCValsForImpedance({ real: 50, imag: 25 }, 1e8);
                output += `• RLC for 50 + j25 @ 100MHz:\n  R: ${comp.resistor_real.toFixed(2)} Ω, L: ${(comp.inductor * 1e9).toFixed(2)} nH\n`;
            }
            output += `• All matching function references in transmission_line.js are accessible.`;
            document.getElementById('matching-output').textContent = output;
        }

        function inspectSParameters() {
            let output = `S-Parameters & Signal Flow Check:\n------------------------------------\n`;
            if (globalThis.S11 && globalThis.S21) {
                output += `• S11: ${globalThis.S11.real.toFixed(4)} + j(${globalThis.S11.imag.toFixed(4)})\n`;
                output += `• S21: ${globalThis.S21.real.toFixed(4)} + j(${globalThis.S21.imag.toFixed(4)})\n`;
                output += `• S12: ${globalThis.S12.real.toFixed(4)} + j(${globalThis.S12.imag.toFixed(4)})\n`;
                output += `• S22: ${globalThis.S22.real.toFixed(4)} + j(${globalThis.S22.imag.toFixed(4)})\n`;
            } else {
                output += `• S-parameter constants can be computed via find_S_params() or get_s_params_from_simulated_circuit()`;
            }
            document.getElementById('sparam-output').textContent = output;
        }

        // Verify transmission_line.js load
        window.addEventListener('DOMContentLoaded', () => {
            initNavigation();
            selectPage(0);

            if (typeof globalThis.getTLWaveParams === 'function') {
                document.getElementById('api-status-text').textContent = 'API connected & ready';
            } else {
                document.getElementById('api-status-text').textContent = 'Warning: transmission_line.js pending';
            }
        });
    </script>
</body>
