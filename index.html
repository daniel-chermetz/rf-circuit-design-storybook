        function calculateS12ParameterDemo() {
            if (typeof globalThis.get_parallel_series_parallel_equivalent_z !== 'function' ||
                typeof globalThis.find_pre_two_port_impedance_current_voltage !== 'function' ||
                typeof globalThis.get_voltage_across_load_with_parallel_series_parallel_two_port_z !== 'function' ||
                typeof globalThis.getTLRefelectionCoefficient !== 'function') {
                const outEl = document.getElementById('s12-output');
                if (outEl) outEl.textContent = 'Error: radio_frequency_electric_circuit_calculator.js functions not found!';
                return;
            }

            const z0 = parseFloat(document.getElementById('s12-z0').value);
            const vg2 = parseFloat(document.getElementById('s12-vg-mag').value);
            const zg2Real = parseFloat(document.getElementById('s12-zg-real').value);

            const zPre = {
                real: parseFloat(document.getElementById('s12-zpre-real').value),
                imag: parseFloat(document.getElementById('s12-zpre-imag').value)
            };
            const zSeries = {
                real: parseFloat(document.getElementById('s12-zseries-real').value),
                imag: parseFloat(document.getElementById('s12-zseries-imag').value)
            };
            const zPost = {
                real: parseFloat(document.getElementById('s12-zpost-real').value),
                imag: parseFloat(document.getElementById('s12-zpost-imag').value)
            };

            // Reverse configuration: Port 1 is terminated in matched characteristic impedance Z0
            const matchedLoadAtPort1 = { z_real: z0, z_imag: 0 };

            // 1. Z(port 2) and S22
            const zPort2 = globalThis.get_parallel_series_parallel_equivalent_z(
                zPost,
                zSeries,
                zPre,
                matchedLoadAtPort1
            );
            const s22 = globalThis.getTLRefelectionCoefficient(zPort2.real, zPort2.imag, z0, 0).reflection;

            // 2. Simulate terminal voltage V2 and current I2 at Port 2 with generator
            const gen2Equivalent = {
                z_real: zg2Real,
                z_imag: 0,
                voltage_real: vg2,
                voltage_imag: 0
            };
            const sim2Results = globalThis.find_pre_two_port_impedance_current_voltage(gen2Equivalent, zPort2);
            const v2 = sim2Results.voltage_pre_two_port;
            const i2 = sim2Results.generator_current;

            // 3. Simulate voltage V1 across the matched load at Port 1
            const v1 = globalThis.get_voltage_across_load_with_parallel_series_parallel_two_port_z(
                i2, v2, zPost, zSeries, zPre, z0
            );

            // 4. Wave variables via zero-length TL concept
            const sqrtZ0 = Math.sqrt(z0);
            const onePlusS22 = { real: 1 + s22.real, imag: s22.imag };

            // a2 = (V2 / sqrt(Z0)) / (1 + S22)
            const v2Plus = globalThis.divideComplexNums(v2.real, v2.imag, onePlusS22.real, onePlusS22.imag);
            const a2 = {
                real: v2Plus.real / sqrtZ0,
                imag: v2Plus.imag / sqrtZ0,
                magnitude: Math.hypot(v2Plus.real, v2Plus.imag) / sqrtZ0
            };

            // b1 = V1 / sqrt(Z0) (since a1 = 0)
            const b1 = {
                real: v1.real / sqrtZ0,
                imag: v1.imag / sqrtZ0,
                magnitude: Math.hypot(v1.real, v1.imag) / sqrtZ0
            };

            // 5. S12 = (V1 / V2) * (1 + S22)
            const v1OverV2 = globalThis.divideComplexNums(v1.real, v1.imag, v2.real, v2.imag);
            const s12 = globalThis.multiplyComplexNums(v1OverV2.real, v1OverV2.imag, onePlusS22.real, onePlusS22.imag);
            const s12Mag = Math.hypot(s12.real, s12.imag);
            const s12PhaseDeg = Math.atan2(s12.imag, s12.real) * 180 / Math.PI;

            // Power metrics
            const powerGainLinear = s12Mag * s12Mag;
            const s12Db = s12Mag > 0 ? (20 * Math.log10(s12Mag)) : -Infinity;

            // Verification against find_S_params from calculator & reciprocity against S21
            let apiComparisonText = '';
            let reciprocityText = '';
            if (typeof globalThis.find_S_params === 'function') {
                try {
                    const genObj = {
                        generator_distance: 1,
                        generator_tl1_length: 0.5,
                        generator_tl2_length: 0.5,
                        generator_voltage_real: 1.0,
                        generator_voltage_imag: 0,
                        generator_impedance_real: 50,
                        generator_impedance_imag: 0
                    };
                    const sParamsObj = globalThis.find_S_params(genObj, zPre, zSeries, zPost, z0, 3.14159);
                    const s12Api = sParamsObj.S12;
                    const s21Api = sParamsObj.S21;
                    const diffS12 = Math.hypot(s12.real - s12Api.real, s12.imag - s12Api.imag);
                    const diffReciprocity = Math.hypot(s12.real - s21Api.real, s12.imag - s21Api.imag);

                    apiComparisonText = `• Verified vs find_S_params S₁₂: CONFIRMED! (Difference = ${diffS12.toExponential(2)})`;
                    reciprocityText = `• Reciprocity Check (S₁₂ === S₂₁): CONFIRMED! (|S₁₂ - S₂₁| = ${diffReciprocity.toExponential(2)})`;
                } catch (e) {
                    apiComparisonText = '• find_S_params verification: ' + e.message;
                }
            }

            document.getElementById('s12-output').textContent = 
                `S₁₂ Reverse Transmission Computation & Wave Analysis:\n` +
                `--------------------------------------------------\n` +
                `Network & Port Configuration:\n` +
                `• Reference Characteristic Z₀:  ${z0.toFixed(2)} Ω\n` +
                `• Pre-Series Shunt Z_p1:        ${zPre.real.toFixed(2)} + j(${zPre.imag.toFixed(2)}) Ω\n` +
                `• Series Branch Z_series:       ${zSeries.real.toFixed(2)} + j(${zSeries.imag.toFixed(2)}) Ω\n` +
                `• Post-Series Shunt Z_p2:       ${zPost.real.toFixed(2)} + j(${zPost.imag.toFixed(2)}) Ω\n` +
                `• Port 1 Matched Load:          Z_load1 = Z₀ = ${z0.toFixed(2)} Ω  (a₁ = 0, no re-reflections from Port 1!)\n\n` +
                `Step 1: Output Port 2 Reflection Analysis:\n` +
                `• Output Impedance Z(port 2):   ${zPort2.real.toFixed(3)} + j(${zPort2.imag.toFixed(3)}) Ω\n` +
                `• Output Reflection S₂₂:        ${s22.real.toFixed(4)} + j(${s22.imag.toFixed(4)})  [|S₂₂| = ${s22.magnitude.toFixed(4)}, θ = ${(s22.theta * 180 / Math.PI).toFixed(2)}°]\n` +
                `• Boundary Factor (1 + S₂₂):    ${onePlusS22.real.toFixed(4)} + j(${onePlusS22.imag.toFixed(4)})\n\n` +
                `Step 2: Simulated Terminal Voltages (Vg2 = ${vg2} V, Zsource2 = ${zg2Real} Ω):\n` +
                `• Voltage at Port 2 V(L2):      ${v2.real.toFixed(4)} + j(${v2.imag.toFixed(4)}) V  (|V₂| = ${Math.hypot(v2.real, v2.imag).toFixed(4)} V)\n` +
                `• Voltage at Port 1 V(L1):      ${v1.real.toFixed(4)} + j(${v1.imag.toFixed(4)}) V  (|V₁| = ${Math.hypot(v1.real, v1.imag).toFixed(4)} V)\n` +
                `• Voltage Transfer Ratio V₁ / V₂: ${v1OverV2.real.toFixed(4)} + j(${v1OverV2.imag.toFixed(4)})  (|V₁/V₂| = ${Math.hypot(v1OverV2.real, v1OverV2.imag).toFixed(4)})\n\n` +
                `Step 3: Power Waves via Zero-Length Line Concept:\n` +
                `• Reverse Incident a₂ = V₂⁺/√Z₀: ${a2.real.toFixed(4)} + j(${a2.imag.toFixed(4)}) √W  (|a₂| = ${a2.magnitude.toFixed(4)} √W, |V₂⁺| = ${Math.hypot(v2Plus.real, v2Plus.imag).toFixed(4)} V)\n` +
                `• Outgoing Wave b₁ = V₁/√Z₀:    ${b1.real.toFixed(4)} + j(${b1.imag.toFixed(4)}) √W  (|b₁| = ${b1.magnitude.toFixed(4)} √W)\n\n` +
                `Step 4: Reverse Transmission Coefficient S₁₂ = [V₁ / V₂] · (1 + S₂₂) = b₁ / a₂:\n` +
                `• Complex S₁₂:                  ${s12.real.toFixed(4)} + j(${s12.imag.toFixed(4)})\n` +
                `• Magnitude |S₁₂|:              ${s12Mag.toFixed(4)}\n` +
                `• Phase Angle θ(S₁₂):           ${s12PhaseDeg.toFixed(2)}° (${(s12PhaseDeg * Math.PI / 180).toFixed(4)} rad)\n` +
                `• Insertion Gain / Loss:        ${s12Db.toFixed(2)} dB  [20 · log₁₀(|S₁₂|)]\n` +
                `• Linear Power Gain |S₁₂|²:     ${powerGainLinear.toFixed(4)}  (Transmits ${(powerGainLinear * 100).toFixed(2)}% of incident power to port 1)\n` +
                (apiComparisonText ? apiComparisonText + '\n' : '') +
                (reciprocityText ? reciprocityText + '\n' : '') +
                `\nSource Independence & Algebra Verification:\n` +
                `• Step 3 algebra verified: a₂ = V₂ / [√Z₀ · (1 + S₂₂)] is exact.\n` +
                `• Changing Vg2 or Zsource2 alters V₂ and V₁, but their quotient V₁/V₂ and S₁₂ remain strictly invariant!`;
        }

        function calculateAmplifierSimSParamsDemo() {

            };
            const v2Fwd = {
                real: parseFloat(document.getElementById('amp-fwd-v2-re').value) || 0,
                imag: parseFloat(document.getElementById('amp-fwd-v2-im').value) || 0
            };
            const i2Fwd = {
                real: parseFloat(document.getElementById('amp-fwd-i2-re').value) || 0,
                imag: parseFloat(document.getElementById('amp-fwd-i2-im').value) || 0
            };

            const v1Rev = {
                real: parseFloat(document.getElementById('amp-rev-v1-re').value) || 0,
                imag: parseFloat(document.getElementById('amp-rev-v1-im').value) || 0
            };
            const i1Rev = {
                real: parseFloat(document.getElementById('amp-rev-i1-re').value) || 0,
                imag: parseFloat(document.getElementById('amp-rev-i1-im').value) || 0
            };
            const v2Rev = {
                real: parseFloat(document.getElementById('amp-rev-v2-re').value) || 0,
                imag: parseFloat(document.getElementById('amp-rev-v2-im').value) || 0
            };
            const i2Rev = {
                real: parseFloat(document.getElementById('amp-rev-i2-re').value) || 0,
                imag: parseFloat(document.getElementById('amp-rev-i2-im').value) || 0
            };

            if (typeof globalThis.get_s_params_from_simulated_circuit !== 'function') {
                document.getElementById('amp-sim-output').textContent = 'Error: globalThis.get_s_params_from_simulated_circuit is not defined!';
                return;
            }

            // Forward extraction: generator at Port 1, load at Port 2
            const fwdResults = globalThis.get_s_params_from_simulated_circuit(
                { voltage: v1Fwd, current: i1Fwd },
                { voltage: v2Fwd, current: i2Fwd },
                z0,
                false
            );

            // Reverse extraction: generator at Port 2, load at Port 1
            const revResults = globalThis.get_s_params_from_simulated_circuit(
                { voltage: v2Rev, current: i2Rev },
                { voltage: v1Rev, current: i1Rev },
                z0,
                true
            );

            const s11 = fwdResults.S11;
            const s21 = fwdResults.S21;
            const s12 = revResults.S12;
            const s22 = revResults.S22;

            const s11PhaseDeg = Math.atan2(s11.imag, s11.real) * 180 / Math.PI;

            const s12PhaseDeg = Math.atan2(s12.imag, s12.real) * 180 / Math.PI;
            const s22PhaseDeg = Math.atan2(s22.imag, s22.real) * 180 / Math.PI;

            // Forward Gain & Return Losses
            const s21Db = s21.magnitude > 0 ? (20 * Math.log10(s21.magnitude)) : -Infinity;
            const s12Db = s12.magnitude > 0 ? (20 * Math.log10(s12.magnitude)) : -Infinity;
            const s11Db = s11.magnitude > 0 ? (20 * Math.log10(s11.magnitude)) : -Infinity;
            const s22Db = s22.magnitude > 0 ? (20 * Math.log10(s22.magnitude)) : -Infinity;
            const powerGainLinear = s21.magnitude * s21.magnitude;

            // Rollett Stability Factor K and Delta
            const s11s22 = globalThis.multiplyComplexNums(s11.real, s11.imag, s22.real, s22.imag);
            const s12s21 = globalThis.multiplyComplexNums(s12.real, s12.imag, s21.real, s21.imag);
            const delta = { real: s11s22.real - s12s21.real, imag: s11s22.imag - s12s21.imag };
            const deltaMag = Math.hypot(delta.real, delta.imag);

            const kNum = 1 - (s11.magnitude * s11.magnitude) - (s22.magnitude * s22.magnitude) + (deltaMag * deltaMag);
            const kDen = 2 * s12.magnitude * s21.magnitude;
            const rollettK = kDen > 0 ? (kNum / kDen) : Infinity;

            let stabilityVerdict = '';
            if (rollettK > 1 && deltaMag < 1) {

            const zOut = globalThis.divideComplexNums(v2Rev.real, v2Rev.imag, i2Rev.real, i2Rev.imag);

            document.getElementById('amp-sim-output').textContent = 
                `=======================================================================\n` +

                `• Terminal I(L1):               ${i1Fwd.real.toExponential(4)} + j(${i1Fwd.imag.toExponential(4)}) A  (|I₁| = ${Math.hypot(i1Fwd.real, i1Fwd.imag).toExponential(4)} A)\n` +
                `• Terminal V(L2):               ${v2Fwd.real.toExponential(4)} + j(${v2Fwd.imag.toExponential(4)}) V  (|V₂| = ${Math.hypot(v2Fwd.real, v2Fwd.imag).toExponential(4)} V)\n` +
                `• Terminal I(L2):               ${i2Fwd.real.toExponential(4)} + j(${i2Fwd.imag.toExponential(4)}) A  (|I₂| = ${Math.hypot(i2Fwd.real, i2Fwd.imag).toExponential(4)} A)\n` +

        function calculateGammaInDemo() {
            const z0 = parseFloat(document.getElementById('gin-z0').value) || 50;
            const zlReal = parseFloat(document.getElementById('gin-zl-re').value) || 0;
            const zlImag = parseFloat(document.getElementById('gin-zl-im').value) || 0;

            const s11 = {
                real: parseFloat(document.getElementById('gin-s11-re').value) || 0,
                imag: parseFloat(document.getElementById('gin-s11-im').value) || 0
            };
            const s21 = {
                real: parseFloat(document.getElementById('gin-s21-re').value) || 0,
                imag: parseFloat(document.getElementById('gin-s21-im').value) || 0
            };
            const s12 = {
                real: parseFloat(document.getElementById('gin-s12-re').value) || 0,
                imag: parseFloat(document.getElementById('gin-s12-im').value) || 0
            };
            const s22 = {
                real: parseFloat(document.getElementById('gin-s22-re').value) || 0,
                imag: parseFloat(document.getElementById('gin-s22-im').value) || 0
            };

            // 1. Compute Load Reflection Coefficient Gamma_L = (ZL - Z0) / (ZL + Z0)
            const reflLoadObj = globalThis.getTLRefelectionCoefficient(zlReal, zlImag, z0, 0).reflection;
            const gammaL = { real: reflLoadObj.real, imag: reflLoadObj.imag };
            const gammaLMag = reflLoadObj.magnitude;
            const gammaLDeg = (reflLoadObj.theta * 180 / Math.PI);

            // 2. Feedback Numerator = S12 * S21 * Gamma_L
            const s12_s21 = (typeof globalThis.multiplyComplexNums_v2 === 'function') ? 
                globalThis.multiplyComplexNums_v2(s12, s21) : 
                globalThis.multiplyComplexNums(s12.real, s12.imag, s21.real, s21.imag);
            const num = (typeof globalThis.multiplyComplexNums_v2 === 'function') ? 
                globalThis.multiplyComplexNums_v2(s12_s21, gammaL) : 
                globalThis.multiplyComplexNums(s12_s21.real, s12_s21.imag, gammaL.real, gammaL.imag);

            // 3. Feedback Denominator = 1 - S22 * Gamma_L
            const s22_gammaL = (typeof globalThis.multiplyComplexNums_v2 === 'function') ? 
                globalThis.multiplyComplexNums_v2(s22, gammaL) : 
                globalThis.multiplyComplexNums(s22.real, s22.imag, gammaL.real, gammaL.imag);
            const den = {
                real: 1 - s22_gammaL.real,
                imag: -s22_gammaL.imag
            };
            const denMag = Math.hypot(den.real, den.imag);

            // 4. Feedback Term = Numerator / Denominator
            const feedbackTerm = globalThis.divideComplexNums(num.real, num.imag, den.real, den.imag);
            const feedbackMag = Math.hypot(feedbackTerm.real, feedbackTerm.imag);

            // 5. Total Input Reflection Gamma_in = S11 + Feedback Term
            const gammaIn = {
                real: s11.real + feedbackTerm.real,
                imag: s11.imag + feedbackTerm.imag
            };
            const gammaInMag = Math.hypot(gammaIn.real, gammaIn.imag);
            const gammaInDeg = Math.atan2(gammaIn.imag, gammaIn.real) * 180 / Math.PI;

            // 6. Driving-Point Input Impedance Zin = Z0 * (1 + Gamma_in) / (1 - Gamma_in)
            const onePlusGamma = { real: 1 + gammaIn.real, imag: gammaIn.imag };
            const oneMinusGamma = { real: 1 - gammaIn.real, imag: -gammaIn.imag };
            const zRatio = globalThis.divideComplexNums(onePlusGamma.real, onePlusGamma.imag, oneMinusGamma.real, oneMinusGamma.imag);
            const zIn = {
                real: z0 * zRatio.real,
                imag: z0 * zRatio.imag
            };
            const zInMag = Math.hypot(zIn.real, zIn.imag);
            const zInPhaseDeg = Math.atan2(zIn.imag, zIn.real) * 180 / Math.PI;

            // Return loss and stability checks
            const returnLossDb = gammaInMag > 0 ? (-20 * Math.log10(gammaInMag)) : Infinity;
            let stabilityStatus = '';
            if (gammaInMag < 0.9999) {
                stabilityStatus = 'UNCONDITIONALLY PASSIVE INPUT (|Γ_in| < 1, R_in > 0) — Network absorbs incident wave energy safely.';
            } else if (gammaInMag <= 1.0001) {
                stabilityStatus = 'MARGINALLY STABLE BOUNDARY (|Γ_in| ≈ 1, R_in ≈ 0) — Purely reactive boundary (zero net power absorption).';
            } else {
                stabilityStatus = 'POTENTIALLY UNSTABLE / NEGATIVE RESISTANCE (|Γ_in| > 1, R_in < 0) — Reflected wave power exceeds incident wave! Risk of spontaneous oscillation!';
            }

            // Cross-check & wave nodes using findSignalFlowNodeValues
            let sfgApiComparisonText = '';
            let sfgNodesText = '';
            if (typeof globalThis.findSignalFlowNodeValues === 'function') {
                try {
                    const testGen = {
                        generator_voltage_real: 1e-3, // 1 mV test source
                        generator_voltage_imag: 0,
                        generator_impedance_real: z0,
                        generator_impedance_imag: 0,
                        generator_tl1_length: 0, // zero-length reference line at Port 1
                        generator_tl2_length: 0  // zero-length reference line at Port 2
                    };
                    const flowResult = globalThis.findSignalFlowNodeValues(
                        testGen,
                        { real: zlReal, imag: zlImag },
                        s11,
                        s21,
                        s12,
                        s22,
                        z0,
                        0 // beta = 0 for zero-length line
                    );
                    const gammaInApi = flowResult.gamma_in_b1_to_a1_ratio;
                    const diffGammaIn = Math.hypot(gammaIn.real - gammaInApi.real, gammaIn.imag - gammaInApi.imag);

                    const a1Mag = flowResult.a1.magnitude !== undefined ? flowResult.a1.magnitude : Math.hypot(flowResult.a1.real, flowResult.a1.imag);
                    const b1Mag = Math.hypot(flowResult.b1.real, flowResult.b1.imag);
                    const b2Mag = flowResult.b2.magnitude !== undefined ? flowResult.b2.magnitude : Math.hypot(flowResult.b2.real, flowResult.b2.imag);
                    const a2Mag = Math.hypot(flowResult.a2.real, flowResult.a2.imag);
                    const gammaOutMag = Math.hypot(flowResult.gamma_out_b2_to_a2_ratio.real, flowResult.gamma_out_b2_to_a2_ratio.imag);

                    sfgApiComparisonText = `• Engine Cross-Check (findSignalFlowNodeValues): CONFIRMED! (|ΔΓ_in| = ${diffGammaIn.toExponential(2)})\n`;
                    sfgNodesText = 
                        `-----------------------------------------------------------------------\n` +
                        `Engine Signal Flow Node Solutions (globalThis.findSignalFlowNodeValues):\n` +
                        `-----------------------------------------------------------------------\n` +
                        `• Source Wave b_s:              ${flowResult.bs.real.toExponential(4)} + j(${flowResult.bs.imag.toExponential(4)}) √W  (|b_s| = ${flowResult.bs.magnitude.toExponential(4)} √W)\n` +
                        `• Port 1 Incident Wave a₁:      ${flowResult.a1.real.toExponential(4)} + j(${flowResult.a1.imag.toExponential(4)}) √W  (|a₁| = ${a1Mag.toExponential(4)} √W)\n` +
                        `• Port 1 Reflected Wave b₁:     ${flowResult.b1.real.toExponential(4)} + j(${flowResult.b1.imag.toExponential(4)}) √W  (|b₁| = ${b1Mag.toExponential(4)} √W)\n` +
                        `• Port 2 Transmitted Wave b₂:   ${flowResult.b2.real.toExponential(4)} + j(${flowResult.b2.imag.toExponential(4)}) √W  (|b₂| = ${b2Mag.toExponential(4)} √W)\n` +
                        `• Port 2 Load-Reflected Wave a₂: ${flowResult.a2.real.toExponential(4)} + j(${flowResult.a2.imag.toExponential(4)}) √W  (|a₂| = ${a2Mag.toExponential(4)} √W)\n` +
                        `• Port 2 Output Reflection Γ_out: ${flowResult.gamma_out_b2_to_a2_ratio.real.toFixed(4)} + j(${flowResult.gamma_out_b2_to_a2_ratio.imag.toFixed(4)})  [|Γ_out| = ${gammaOutMag.toFixed(4)}]\n\n`;
                } catch (e) {
                    sfgApiComparisonText = `• findSignalFlowNodeValues: ${e.message}\n`;
                }
            }

            // Print formatted breakdown
            document.getElementById('gamma-in-output').textContent = 
                `=======================================================================\n` +
                `  INPUT REFLECTION (Γ_in) & DRIVING-POINT IMPEDANCE (Z_in) ANALYSIS     \n` +
                `=======================================================================\n\n` +
                `Reference & Port Parameters:\n` +
                `• Reference Characteristic Z₀:  ${z0.toFixed(2)} Ω\n` +
                `• Connected Load Impedance Z_L:  ${zlReal.toFixed(2)} + j(${zlImag.toFixed(2)}) Ω\n` +
                `• Load Reflection Γ_L:          ${gammaL.real.toFixed(4)} + j(${gammaL.imag.toFixed(4)})  [|Γ_L| = ${gammaLMag.toFixed(4)}, θ = ${gammaLDeg.toFixed(2)}°]\n\n` +
                `Two-Port S-Parameters:\n` +
                `• S₁₁ (Input Reflection):       ${s11.real.toFixed(4)} + j(${s11.imag.toFixed(4)})  (|S₁₁| = ${Math.hypot(s11.real, s11.imag).toFixed(4)})\n` +
                `• S₂₁ (Forward Transmission):   ${s21.real.toFixed(4)} + j(${s21.imag.toFixed(4)})  (|S₂₁| = ${Math.hypot(s21.real, s21.imag).toFixed(4)})\n` +
                `• S₁₂ (Reverse Feedback):       ${s12.real.toFixed(4)} + j(${s12.imag.toFixed(4)})  (|S₁₂| = ${Math.hypot(s12.real, s12.imag).toFixed(4)})\n` +
                `• S₂₂ (Output Reflection):      ${s22.real.toFixed(4)} + j(${s22.imag.toFixed(4)})  (|S₂₂| = ${Math.hypot(s22.real, s22.imag).toFixed(4)})\n\n` +
                `Step-by-Step Algebraic Derivation Evaluation:\n` +
                `• Loop Numerator (S₁₂ · S₂₁ · Γ_L):   ${num.real.toExponential(4)} + j(${num.imag.toExponential(4)})\n` +
                `• Loop Denominator (1 - S₂₂ · Γ_L):   ${den.real.toFixed(4)} + j(${den.imag.toFixed(4)})  (|Den| = ${denMag.toFixed(4)})\n` +
                `• Feedback Delta Term ΔΓ:            ${feedbackTerm.real.toFixed(4)} + j(${feedbackTerm.imag.toFixed(4)})  (|ΔΓ| = ${feedbackMag.toFixed(4)})\n\n` +
                `Result 1: Input Reflection Coefficient Γ_in = S₁₁ + ΔΓ:\n` +
                `• Complex Γ_in:                 ${gammaIn.real.toFixed(4)} + j(${gammaIn.imag.toFixed(4)})\n` +
                `• Magnitude |Γ_in|:             ${gammaInMag.toFixed(4)}\n` +
                `• Phase Angle θ(Γ_in):          ${gammaInDeg.toFixed(2)}° (${(gammaInDeg * Math.PI / 180).toFixed(4)} rad)\n` +
                `• Input Return Loss:            ${returnLossDb === Infinity ? '∞' : returnLossDb.toFixed(2)} dB  [-20 · log₁₀(|Γ_in|)]\n\n` +
                `Result 2: Driving-Point Input Impedance Z_in = Z₀ · (1 + Γ_in) / (1 - Γ_in):\n` +
                `• Input Impedance Z_in:         ${zIn.real.toFixed(2)} + j(${zIn.imag.toFixed(2)}) Ω\n` +

                `Physical Takeaways:\n` +

            };

            };

            // 3. Feedback Denominator = 1 - S11 * Gamma_s

            // 6. Thevenin Output Impedance Zout = Z0 * (1 + Gamma_out) / (1 - Gamma_out)
            const onePlusGamma = { real: 1 + gammaOut.real, imag: gammaOut.imag };
            const oneMinusGamma = { real: 1 - gammaOut.real, imag: -gammaOut.imag };
            const zRatio = globalThis.divideComplexNums(onePlusGamma.real, onePlusGamma.imag, oneMinusGamma.real, oneMinusGamma.imag);
            const zOut = {
                real: z0 * zRatio.real,
                imag: z0 * zRatio.imag
            };
            const zOutMag = Math.hypot(zOut.real, zOut.imag);
            const zOutPhaseDeg = Math.atan2(zOut.imag, zOut.real) * 180 / Math.PI;

            // Return loss and stability checks
            const returnLossDb = gammaOutMag > 0 ? (-20 * Math.log10(gammaOutMag)) : Infinity;
            let stabilityStatus = '';
            if (gammaOutMag < 0.9999) {
                stabilityStatus = 'UNCONDITIONALLY PASSIVE OUTPUT (|Γ_out| < 1, R_out > 0) — Port absorbs test wave energy safely.';
            } else if (gammaOutMag <= 1.0001) {
                stabilityStatus = 'MARGINALLY STABLE BOUNDARY (|Γ_out| ≈ 1, R_out ≈ 0) — Purely reactive boundary (zero net power absorption).';
            } else {
                stabilityStatus = 'POTENTIALLY UNSTABLE / NEGATIVE OUTPUT RESISTANCE (|Γ_out| > 1, R_out < 0) — Reflected wave power exceeds incident wave! Severe risk of spontaneous self-oscillation into external loads!';
            }

            // Cross-check & wave nodes using findSignalFlowNodeValues
            let sfgApiComparisonText = '';
            let sfgNodesText = '';
            if (typeof globalThis.findSignalFlowNodeValues === 'function') {
                try {
                    const testGen = {
                        generator_voltage_real: 1e-3,
                        generator_voltage_imag: 0,
                        generator_impedance_real: zsReal,
                        generator_impedance_imag: zsImag,
                        generator_tl1_length: 0,
                        generator_tl2_length: 0
                    };
                    const flowResult = globalThis.findSignalFlowNodeValues(
                        testGen,
                        { real: z0, imag: 0 },
                        s11,
                        s21,
                        s12,
                        s22,
                        z0,
                        0
                    );
                    const gammaOutApi = flowResult.gamma_out_b2_to_a2_ratio;
                    const diffGammaOut = Math.hypot(gammaOut.real - gammaOutApi.real, gammaOut.imag - gammaOutApi.imag);

                    sfgApiComparisonText = `• Engine Cross-Check (findSignalFlowNodeValues): CONFIRMED! (|ΔΓ_out| = ${diffGammaOut.toExponential(2)})\n`;
                    sfgNodesText = 
                        `-----------------------------------------------------------------------\n` +
                        `Engine Signal Flow Solutions (globalThis.findSignalFlowNodeValues):\n` +
                        `-----------------------------------------------------------------------\n` +
                        `• Evaluated gamma_out_b2_to_a2_ratio: ${gammaOutApi.real.toFixed(4)} + j(${gammaOutApi.imag.toFixed(4)})\n` +
                        `• Port 1 Input Reflection Γ_in:       ${flowResult.gamma_in_b1_to_a1_ratio.real.toFixed(4)} + j(${flowResult.gamma_in_b1_to_a1_ratio.imag.toFixed(4)})\n` +
                        `• Source Wave b_s (from test gen):    ${flowResult.bs.real.toExponential(4)} + j(${flowResult.bs.imag.toExponential(4)}) √W\n\n`;
                } catch (e) {
                    sfgApiComparisonText = `• findSignalFlowNodeValues: ${e.message}\n`;
                }
            }

            // Print formatted breakdown
            document.getElementById('gamma-out-output').textContent = 
                `=======================================================================\n` +
                `  OUTPUT REFLECTION (Γ_out) & THEVENIN IMPEDANCE (Z_out) ANALYSIS      \n` +
                `=======================================================================\n\n` +
                `Reference & Port Parameters:\n` +
                `• Reference Characteristic Z₀:  ${z0.toFixed(2)} Ω\n` +
                `• Generator Source Impedance Z_s: ${zsReal.toFixed(2)} + j(${zsImag.toFixed(2)}) Ω\n` +
                `• Source Reflection Γ_s:         ${gammaS.real.toFixed(4)} + j(${gammaS.imag.toFixed(4)})  [|Γ_s| = ${gammaSMag.toFixed(4)}, θ = ${gammaSDeg.toFixed(2)}°]\n\n` +
                `Two-Port S-Parameters:\n` +
                `• S₁₁ (Input Reflection):       ${s11.real.toFixed(4)} + j(${s11.imag.toFixed(4)})  (|S₁₁| = ${Math.hypot(s11.real, s11.imag).toFixed(4)})\n` +
                `• S₂₁ (Forward Transmission):   ${s21.real.toFixed(4)} + j(${s21.imag.toFixed(4)})  (|S₂₁| = ${Math.hypot(s21.real, s21.imag).toFixed(4)})\n` +
                `• S₁₂ (Reverse Feedback):       ${s12.real.toFixed(4)} + j(${s12.imag.toFixed(4)})  (|S₁₂| = ${Math.hypot(s12.real, s12.imag).toFixed(4)})\n` +
                `• S₂₂ (Output Reflection):      ${s22.real.toFixed(4)} + j(${s22.imag.toFixed(4)})  (|S₂₂| = ${Math.hypot(s22.real, s22.imag).toFixed(4)})\n\n` +
                `Step-by-Step Algebraic Derivation Evaluation:\n` +
                `• Loop Numerator (S₁₂ · S₂₁ · Γ_s):   ${num.real.toExponential(4)} + j(${num.imag.toExponential(4)})\n` +
                `• Loop Denominator (1 - S₁₁ · Γ_s):   ${den.real.toFixed(4)} + j(${den.imag.toFixed(4)})  (|Den| = ${denMag.toFixed(4)})\n` +
                `• Feedback Delta Term ΔΓ:            ${feedbackTerm.real.toFixed(4)} + j(${feedbackTerm.imag.toFixed(4)})  (|ΔΓ| = ${feedbackMag.toFixed(4)})\n\n` +
                `Result 1: Output Reflection Coefficient Γ_out = S₂₂ + ΔΓ:\n` +
                `• Complex Γ_out:                ${gammaOut.real.toFixed(4)} + j(${gammaOut.imag.toFixed(4)})\n` +
                `• Magnitude |Γ_out|:            ${gammaOutMag.toFixed(4)}\n` +
                `• Phase Angle θ(Γ_out):         ${gammaOutDeg.toFixed(2)}° (${(gammaOutDeg * Math.PI / 180).toFixed(4)} rad)\n` +
                `• Output Return Loss:           ${returnLossDb === Infinity ? '∞' : returnLossDb.toFixed(2)} dB  [-20 · log₁₀(|Γ_out|)]\n\n` +
                `Result 2: Thevenin Equivalent Output Impedance Z_out = Z₀ · (1 + Γ_out) / (1 - Γ_out):\n` +
                `• Output Impedance Z_out:       ${zOut.real.toFixed(2)} + j(${zOut.imag.toFixed(2)}) Ω\n` +
                `• Magnitude |Z_out|:            ${zOutMag.toFixed(2)} Ω\n` +
                `• Phase Angle θ(Z_out):         ${zOutPhaseDeg.toFixed(2)}°\n\n` +
                (sfgNodesText || '') +
                `Stability & Passivity Verdict:\n` +
                `• ${stabilityStatus}\n` +
                (sfgApiComparisonText ? sfgApiComparisonText + '\n' : '\n') +
                `Physical Takeaways:\n` +
                (Math.abs(gammaSMag) < 1e-6 ? 
                    `• Matched Source Verification: Since Γ_s = 0, the feedback term ΔΓ = 0. Therefore, Γ_out ≡ S₂₂ (${s22.real.toFixed(4)} + j${s22.imag.toFixed(4)}) and Z_out ≡ ${zOut.real.toFixed(2)} + j(${zOut.imag.toFixed(2)}) Ω, exactly reproducing the Chapter 12 reverse simulation impedance!\n` :
                    `• Source Pull Effect: Because S₁₂ ≠ 0, the source reflection Γ_s (${gammaSMag.toFixed(3)} ∠ ${gammaSDeg.toFixed(1)}°) shifted Γ_out away from S₂₂ by ΔΓ (${feedbackMag.toFixed(3)}), modifying Z_out from 128.02 - j119.34 Ω to ${zOut.real.toFixed(2)} + j(${zOut.imag.toFixed(2)}) Ω.\n`) +
                (Math.abs(s12.real) < 1e-6 && Math.abs(s12.imag) < 1e-6 ? 
                    `• Unilateral Verification: With S₁₂ = 0, no signal reflects back through the transistor. Γ_out ≡ S₂₂ regardless of source impedance!\n` : 
                    `• Thevenin Equivalence: In circuit simulation or hardware testing, the load Z_L simply sees an ideal source V_Th in series with Z_out.`);
        }

        function calculateWaveParams() {
            if (typeof globalThis.getTLWaveParams !== 'function') {
                document.getElementById('wave-params-output').textContent = 'Error: globalThis.getTLWaveParams is not defined!';
                return;
            }
            const R = parseFloat(document.getElementById('param-r').value);
            const L = parseFloat(document.getElementById('param-l').value);
            const G = parseFloat(document.getElementById('param-g').value);
            const C = parseFloat(document.getElementById('param-c').value);
            const f = parseFloat(document.getElementById('param-freq').value);

            const result = globalThis.getTLWaveParams(R, L, G, C, f);
            document.getElementById('wave-params-output').textContent = 
                `Calculated Wave Parameters:\n` +
                `------------------------------------\n` +
                `• Z0 Magnitude:       ${result.z0_magnitude.toFixed(3)} Ω\n` +
                `• Z0 Phase:           ${(result.z0_theta * 180 / Math.PI).toFixed(3)}°\n` +
                `• Z0 Complex:         ${result.z0_real.toFixed(3)} + j(${result.z0_imag.toFixed(3)}) Ω\n` +
                `• Attenuation (α):    ${result.alpha.toFixed(5)} Np/m\n` +
                `• Phase Const (β):    ${result.beta.toFixed(5)} rad/m\n` +
                `• Phase Velocity:     ${(result.phase_velocity_up / 1e8).toFixed(4)} × 10⁸ m/s (${(result.phase_velocity_frac_of_c * 100).toFixed(2)}% of c)`;
        }

        function calculateReflectionAndSWR() {
            if (typeof globalThis.getTLRefelectionCoefficient !== 'function') {
                document.getElementById('reflection-output').textContent = 'Error: getTLRefelectionCoefficient not found.';
                return;
            }
            const zlReal = parseFloat(document.getElementById('zl-real').value);
            const zlImag = parseFloat(document.getElementById('zl-imag').value);
            const z0Mag = parseFloat(document.getElementById('z0-mag').value);
            const z0Phase = parseFloat(document.getElementById('z0-phase').value);

            const reflResult = globalThis.getTLRefelectionCoefficient(zlReal, zlImag, z0Mag, z0Phase);
            const swr = globalThis.getStandingWaveRatio_lossless_TL ? globalThis.getStandingWaveRatio_lossless_TL(reflResult.reflection) : 'N/A';

            document.getElementById('reflection-output').textContent = 
                `Reflection & Standing Wave Ratio:\n` +
                `------------------------------------\n` +
                `• Normalized Load zL: ${reflResult.normalized_load_impedance.real.toFixed(4)} + j(${reflResult.normalized_load_impedance.imag.toFixed(4)})\n` +
                `• Reflection |Γ|:     ${reflResult.reflection.magnitude.toFixed(4)}\n` +
                `• Reflection Phase:   ${(reflResult.reflection.theta * 180 / Math.PI).toFixed(3)}° (${reflResult.reflection.theta.toFixed(4)} rad)\n` +
                `• Reflection Complex: ${reflResult.reflection.real.toFixed(4)} + j(${reflResult.reflection.imag.toFixed(4)})\n` +
                `• SWR / VSWR:         ${typeof swr === 'number' ? swr.toFixed(4) : swr}`;
        }

        function calculateImpedanceAtDistance() {
            if (typeof globalThis.getImpedanceAtDistanceFromLoad_lossless_TL !== 'function') {
                document.getElementById('dist-output').textContent = 'Error: getImpedanceAtDistanceFromLoad_lossless_TL not defined.';
                return;
            }
            const d = parseFloat(document.getElementById('dist-d').value);
            const beta = parseFloat(document.getElementById('dist-beta').value);
            const z0 = parseFloat(document.getElementById('dist-z0').value);
            
            // Construct a sample reflection with magnitude 0.35 and 45 deg angle
            const sampleRefl = { magnitude: 0.35, theta: Math.PI / 4 };
            const zin = globalThis.getImpedanceAtDistanceFromLoad_lossless_TL(d, sampleRefl, z0, beta);

            document.getElementById('dist-output').textContent = 
                `Input Impedance at d = ${d} m:\n` +
                `------------------------------------\n` +
                `• Zin Real:      ${zin.real.toFixed(3)} Ω\n` +
                `• Zin Imag:      ${zin.imag.toFixed(3)} Ω\n` +
                `• Zin Magnitude: ${zin.magnitude.toFixed(3)} Ω\n` +
                `• Zin Phase:     ${(zin.theta * 180 / Math.PI).toFixed(2)}°`;
        }

            let output = `Impedance Matching Utilities Check:\n------------------------------------\n`;
            if (typeof globalThis.match_real_impedance_by_quarter_wave_length_lossless_TL === 'function') {

            }

            document.getElementById('matching-output').textContent = output;
        }

        function inspectSParameters() {
            let output = `S-Parameters & Signal Flow Check:\n------------------------------------\n`;
            if (globalThis.S11 && globalThis.S21) {
                output += `• S11: ${globalThis.S11.real.toFixed(4)} + j(${globalThis.S11.imag.toFixed(4)})\n`;
                output += `• S21: ${globalThis.S21.real.toFixed(4)} + j(${globalThis.S21.imag.toFixed(4)})\n`;
                output += `• S12: ${globalThis.S12.real.toFixed(4)} + j(${globalThis.S12.imag.toFixed(4)})\n`;
                output += `• S22: ${globalThis.S22.real.toFixed(4)} + j(${globalThis.S22.imag.toFixed(4)})\n`;
            } else {
                output += `• S-parameter constants can be computed via find_S_params() or get_s_params_from_simulated_circuit()`;
            }
            document.getElementById('sparam-output').textContent = output;
        }

        // Verify transmission_line.js load
        window.addEventListener('DOMContentLoaded', () => {
            initNavigation();
            selectPage(0);

            if (typeof globalThis.getTLWaveParams === 'function') {
                document.getElementById('api-status-text').textContent = 'API connected & ready';
            } else {
                document.getElementById('api-status-text').textContent = 'Warning: API pending';
            }
        });
