<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Electromagnetic Utilities - Storybook</title>
    
    <!-- External typography matching design_example.html -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- MathJax 4 Configuration & Script -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
            },
            startup: {
                ready: () => {
                    MathJax.startup.defaultReady();
                    if (typeof renderMath === 'function') {
                        renderMath();
                    }
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>

    <!-- Chart.js for Transmission Line Voltage Plotting -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Import transmission line utilities API -->
    <script src="./radio_frequency_electric_circuit_calculator.js"></script>

    <style>
        /* --- Color Variables & Typography matching design_example.html --- */
        :root {
            --primary-color: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary-color: #64748b;
            --success-color: #10b981;
            --success-dark: #059669;
            --accent-purple: #764ba2;
            --bg-color: #f1f5f9;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg-color: #ffffff;
            --text-color: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            --font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background: var(--bg-gradient);
            background-image: url('victorianBackground.png'), var(--bg-gradient);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: var(--text-color);
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            align-items: stretch;
            justify-content: center;
        }

        /* --- Storybook App Wrapper --- */
        .app-layout {
            display: flex;
            width: 100%;
            max-width: 1440px;
            gap: 24px;
            min-height: calc(100vh - 48px);
        }

        /* --- Left Sidebar / Navigation Panel --- */
        .sidebar {
            width: 320px;
            min-width: 280px;
            flex-shrink: 0;
            background-color: var(--card-bg-color);
            border-radius: 16px;
            box-shadow: var(--shadow-xl);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            animation: fadeIn 0.4s ease-in;
        }

        .sidebar-header {
            padding: 24px 20px 18px;
            border-bottom: 2px solid var(--border-color);
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
        }

        .sidebar-header h2 {
            margin: 0;
            font-size: 1.25em;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-align: left;
        }

        .sidebar-subtitle {
            margin: 6px 0 0;
            font-size: 0.82em;
            color: var(--text-muted);
            font-weight: 500;
        }

        .nav-list {
            list-style: none;
            margin: 0;
            padding: 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            flex: 1;
        }

        .nav-category {
            font-size: 0.75em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            padding: 10px 12px 4px;
        }

        .nav-item-btn {
            width: 100%;
            text-align: left;
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            padding: 12px 14px;
            border-radius: 10px;
            font-family: var(--font-family);
            font-size: 0.92em;
            font-weight: 500;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: var(--shadow-sm);
        }

        .nav-item-btn:hover {
            border-color: var(--primary-color);
            color: var(--primary-color);
            transform: translateX(3px);
            background: linear-gradient(135deg, #fefefe 0%, #f8fafc 100%);
        }

        .nav-item-btn.active {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            border-color: var(--primary-color);
            font-weight: 600;
            box-shadow: var(--shadow-md);
            transform: translateX(3px);
        }

        .nav-badge {
            font-family: var(--font-mono);
            font-size: 0.72em;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(99, 102, 241, 0.1);
            color: var(--primary-color);
            margin-left: auto;
            font-weight: 600;
        }

        .nav-item-btn.active .nav-badge {
            background: rgba(255, 255, 255, 0.25);
            color: white;
        }

        .sidebar-footer {
            padding: 14px 18px;
            border-top: 1px solid var(--border-color);
            font-size: 0.78em;
            color: var(--text-muted);
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success-color);
            margin-right: 6px;
            box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
        }

        /* --- Central Main Content Container --- */
        .content-panel {
            flex: 1;
            background-color: var(--card-bg-color);
            border-radius: 16px;
            box-shadow: var(--shadow-xl);
            padding: 36px 44px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(8px);
            animation: fadeIn 0.4s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* --- Story Header --- */
        .story-header {
            margin-bottom: 28px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
        }

        .story-header-titles h1 {
            text-align: left;
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 0 0 8px 0;
            font-weight: 700;
            font-size: 2.1em;
            letter-spacing: -0.02em;
        }

        .story-tagline {
            color: var(--text-muted);
            font-size: 1.02em;
            margin: 0;
            font-weight: 500;
        }

        .page-counter-pill {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 8px 14px;
            font-family: var(--font-mono);
            font-size: 0.82em;
            color: var(--text-muted);
            white-space: nowrap;
        }

        /* --- Section Styling & Story Elements --- */
        .section-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            transition: all 0.25s ease;
        }

        .section-card:hover {
            border-color: var(--border-hover);
            box-shadow: var(--shadow-md);
        }

        .section-card h2, .section-card h3 {
            text-align: left;
            margin-top: 0;
            color: var(--text-color);
            font-weight: 600;
            letter-spacing: -0.01em;
        }

        .section-card h2 {
            font-size: 1.3em;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-card h3 {
            font-size: 1.05em;
            margin-bottom: 8px;
        }

        .section-card p {
            color: var(--text-color);
            line-height: 1.65;
            margin: 0 0 16px 0;
        }

        /* Callout note box styled like design_example context-display */
        .story-callout {
            background: linear-gradient(135deg, #fefefe 0%, #f8fafc 100%);
            border: 2px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            border-radius: 12px;
            padding: 16px 20px;
            margin: 18px 0;
            font-style: italic;
            color: var(--text-color);
            line-height: 1.7;
            box-shadow: var(--shadow-sm);
        }

        /* Action Buttons */
        .primary-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            font-family: var(--font-family);
            font-size: 1.05em;
            font-weight: 600;
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: var(--shadow-md);
            letter-spacing: 0.01em;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .primary-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-lg);
        }

        .primary-btn:active {
            transform: translateY(0);
            box-shadow: var(--shadow-sm);
        }

        .secondary-btn {
            padding: 10px 18px;
            border: 2px solid var(--border-color);
            background-color: white;
            cursor: pointer;
            border-radius: 8px;
            font-family: var(--font-family);
            font-weight: 600;
            color: var(--text-color);
            transition: all 0.2s ease;
            box-shadow: var(--shadow-sm);
        }

        .secondary-btn:hover {
            background-color: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        /* Output / Code display styled like design_example output-area */
        .code-display {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 18px;
            min-height: 80px;
            white-space: pre-wrap;
            line-height: 1.7;
            color: var(--text-color);
            font-family: var(--font-mono);
            font-size: 0.9em;
            box-shadow: var(--shadow-sm);
            margin-top: 14px;
            overflow-x: auto;
        }

        /* Chart container */
        .chart-section-title {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 26px;
            margin-bottom: 6px;
        }

        .chart-section-title h3 {
            margin: 0;
            font-size: 1.12em;
            color: var(--text-color);
            font-weight: 700;
        }

        .chart-badge-pill {
            font-family: var(--font-mono);
            font-size: 0.72em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            padding: 3px 9px;
            border-radius: 6px;
            background: rgba(99, 102, 241, 0.12);
            color: var(--primary-dark);
        }

        .chart-controls-bar {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            background: linear-gradient(135deg, #fcfdff 0%, #f8fafc 100%);
            padding: 10px 16px;
            border-radius: 10px;
            border: 1.5px solid var(--border-color);
            margin-bottom: 12px;
            box-shadow: var(--shadow-sm);
        }

        .chart-controls-label {
            font-size: 0.82em;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-right: 4px;
        }

        .chart-checkbox-item {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-size: 0.88em;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            color: var(--text-color);
            transition: color 0.2s ease;
        }

        .chart-checkbox-item:hover {
            color: var(--primary-color);
        }

        .chart-checkbox-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
            accent-color: var(--primary-color);
        }

        .chart-legend-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 3px;
        }

        .chart-wrapper {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-top: 6px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-sm);
            position: relative;
            height: 360px;
        }

        .chart-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* Circuit diagram illustration container */
        .circuit-illustration-card {
            background: #ffffff;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 24px;
            margin: 20px 0;
            text-align: center;
            box-shadow: var(--shadow-sm);
        }

        .circuit-illustration-card img {
            max-width: 100%;
            height: auto;
            max-height: 420px;
            display: block;
            margin: 0 auto;
            border-radius: 8px;
        }

        .circuit-illustration-caption {
            font-size: 0.85em;
            color: var(--text-muted);
            margin-top: 10px;
            font-weight: 500;
        }

        /* Form Inputs matching design_example */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-size: 0.88em;
            font-weight: 600;
            color: var(--text-color);
        }

        .text-input, .select-input {
            padding: 10px 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.95em;
            font-weight: 500;
            background: white;
            transition: all 0.2s ease;
        }

        .text-input:focus, .select-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
        }

        /* --- Prominent Deep Dive Collapsible Section --- */
        .deep-dive-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fafc 100%);
            border: 2px solid var(--border-color);
            border-radius: 14px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .deep-dive-card:hover {
            border-color: var(--primary-light);
            box-shadow: var(--shadow-md);
        }

        .deep-dive-card.is-expanded {
            border-color: var(--primary-color);
            box-shadow: var(--shadow-lg);
        }

        .deep-dive-header {
            padding: 22px 26px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: linear-gradient(135deg, #fcfdff 0%, #f6f8fc 100%);
            cursor: pointer;
            user-select: none;
            transition: background 0.2s ease;
        }

        .deep-dive-header:hover {
            background: linear-gradient(135deg, #f8fafc 0%, #edf2f9 100%);
        }

        .deep-dive-meta {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .deep-dive-badge-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .deep-dive-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 0.72em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 3px 9px;
            border-radius: 6px;
            background: rgba(99, 102, 241, 0.12);
            color: var(--primary-dark);
            font-family: var(--font-mono);
        }

        .deep-dive-reading-time {
            font-size: 0.8em;
            color: var(--text-muted);
            font-weight: 500;
        }

        .deep-dive-title {
            margin: 0;
            font-size: 1.2em;
            font-weight: 700;
            color: var(--text-color);
            letter-spacing: -0.01em;
        }

        .deep-dive-preview-desc {
            margin: 0;
            font-size: 0.9em;
            color: var(--text-muted);
            line-height: 1.5;
        }

        .deep-dive-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 13px 24px;
            font-family: var(--font-family);
            font-size: 0.98em;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-sm);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            white-space: nowrap;
            flex-shrink: 0;
            transition: all 0.25s ease;
        }

        .deep-dive-btn:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow-md);
        }

        .deep-dive-btn.is-active {
            background: #ffffff;
            color: var(--primary-dark);
            border: 2px solid var(--primary-color);
            box-shadow: var(--shadow-sm);
        }

        .deep-dive-btn.is-active:hover {
            background: #f8fafc;
        }

        .deep-dive-icon {
            display: inline-block;
            transition: transform 0.3s ease;
            font-size: 0.8em;
        }

        .deep-dive-btn.is-active .deep-dive-icon {
            transform: rotate(180deg);
        }

        /* Smooth CSS grid expand/collapse */
        .deep-dive-panel {
            display: grid;
            grid-template-rows: 0fr;
            transition: grid-template-rows 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .deep-dive-panel.open {
            grid-template-rows: 1fr;
        }

        .deep-dive-collapse-inner {
            min-height: 0;
            overflow: hidden;
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        .deep-dive-panel.open .deep-dive-collapse-inner {
            opacity: 1;
        }

        .deep-dive-body {
            padding: 26px 30px 30px;
            border-top: 1.5px solid var(--border-color);
            background: #ffffff;
            line-height: 1.85;
            color: var(--text-color);
        }

        .deep-dive-body h3 {
            font-size: 1.15em;
            font-weight: 700;
            color: var(--primary-dark);
            margin: 24px 0 10px 0;
            letter-spacing: -0.01em;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .deep-dive-body h3:first-child {
            margin-top: 0;
        }

        .deep-dive-body p {
            margin: 0 0 16px 0;
            font-size: 0.98em;
            color: #334155;
            line-height: 1.8;
        }

        .deep-dive-formula-box {
            background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 100%);
            border: 1.5px solid var(--border-color);
            border-left: 4px solid var(--primary-color);
            border-radius: 8px;
            padding: 14px 18px;
            margin: 18px 0;
            color: var(--text-color);
            box-shadow: var(--shadow-sm);
        }

        .deep-dive-formula-box mjx-container {
            margin: 8px 0 !important;
            overflow-x: auto;
            overflow-y: hidden;
            max-width: 100%;
        }

        .deep-dive-formula-title {
            font-weight: 600;
            font-size: 0.82em;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--primary-dark);
            margin-bottom: 8px;
            font-family: var(--font-mono);
        }

        .deep-dive-footer-close {
            margin-top: 24px;
            padding-top: 18px;
            border-top: 1px dashed var(--border-color);
            display: flex;
            justify-content: flex-end;
        }

        /* Story Controls Footer */
        .story-navigation-footer {
            margin-top: auto;
            padding-top: 24px;
            border-top: 2px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Responsive tweaks */
        @media (max-width: 900px) {
            .app-layout {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                min-width: unset;
            }
            .content-panel {
                padding: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- Left Sidebar / Navigation Panel -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>RF Circuit Design Stories</h2>
                <p class="sidebar-subtitle">Electromagnetic Calculation Utilities</p>
            </div>

            <div class="nav-category">Story Pages</div>
            <ul class="nav-list" id="pages-list">
                <!-- Page items injected by script -->
            </ul>

            <div class="sidebar-footer">
                <div>
                    <span class="status-dot"></span>

                        <h3>1. The Anatomy of a Wave: Amplitude, Frequency & Phase</h3>
                        <p>
                            A fundamental travelling or oscillating wave in physics and electrical engineering is described mathematically by a sinusoidal waveform:
                        </p>

                            <li><strong>Frequency ($f$):</strong> The number of complete oscillation cycles occurring each second, measured in Hertz ($\\text{Hz}$).</li>

                        </p>

                        </div>

                        </p>

                        </div>

                        </p>

                            $$(A_1 e^{j\\theta_1}) \\cdot (A_2 e^{j\\theta_2}) = (A_1 \\cdot A_2) e^{j(\\theta_1 + \\theta_2)}$$

                            $$V^-(d, t) = A^- e^{j(\\omega t - \\beta d + \\theta^-)} \\quad [\\text{Backward: Load } \\to \\text{ Generator}]$$

                            connected to an intermediate network between nodes $L_1$ and $L_2$, which in turn connects via a second transmission line

                        </p>
                        <p>
                            By finding the Thevenin equivalent circuit on both the source side (at node $L_1$) and the load side (at node $L_2$), 
                            <strong>we can remove the distributed transmission lines entirely</strong>! This collapses the complex wave problem into

                            $$\\text{Equivalent Impedance: } \\quad Z_{\\text{th,1}} = Z_0 \\left[ \\frac{Z_g + j Z_0 \\tan(\\beta l_1)}{Z_0 + j Z_g \\tan(\\beta l_1)} \\right] = Z_0 \\left[ \\frac{1 + \\Gamma_g e^{-j2\\beta l_1}}{1 - \\Gamma_g e^{-j2\\beta l_1}} \\right]$$

        function evaluateWaveAndPhasor() {
            const A = parseFloat(document.getElementById('wave-amp').value);
            const f = parseFloat(document.getElementById('wave-freq').value);
            const phaseDeg = parseFloat(document.getElementById('wave-phase-deg').value);
            const t = parseFloat(document.getElementById('wave-time').value);

            const phaseRad = phaseDeg * Math.PI / 180;
            const omega = 2 * Math.PI * f;
            const period = f !== 0 ? (1 / f) : Infinity;

            // Value at time 0: A * cos(phase)
            const valAtZero = A * Math.cos(phaseRad);

            // Total phase argument: omega * t + phaseRad
            const totalArgRad = omega * t + phaseRad;
            let normalizedDeg = ((totalArgRad * 180 / Math.PI) % 360);
            if (normalizedDeg < 0) normalizedDeg += 360;

            // Physical wave value
            const physicalVal = A * Math.cos(totalArgRad);

            // Complex exponential representation: A * e^(j * totalArgRad)
            const complexReal = A * Math.cos(totalArgRad);
            const complexImag = A * Math.sin(totalArgRad);

            // Static Phasor: V_tilde = A * e^(j * phaseRad)
            const phasorReal = A * Math.cos(phaseRad);
            const phasorImag = A * Math.sin(phaseRad);

            // Phasor arithmetic demonstration with secondary test phasor: W = 2 * e^(j * 30 deg)
            const demoMag = 2;
            const demoAngleDeg = 30;
            const multMag = A * demoMag;
            const multAngleDeg = phaseDeg + demoAngleDeg;
            const divMag = demoMag !== 0 ? (A / demoMag) : 0;
            const divAngleDeg = phaseDeg - demoAngleDeg;

            document.getElementById('wave-eval-output').textContent = 
                `Sinusoidal Wave & Complex Exponential Evaluation:\n` +
                `--------------------------------------------------\n` +
                `• Wave Equation:           ${A} · cos(2π · ${f} · t + ${phaseDeg}°)\n` +
                `• Angular Frequency (ω):   ${omega.toFixed(4)} rad/s  [2π · f = 2 · π · ${f}]\n` +
                `• Period (T = 1/f):        ${(period * 1000).toFixed(3)} ms  [time for one 2π cycle]\n\n` +
                `Phasor at Time Zero (t = 0):\n` +
                `• Static Phasor Ṽ:         ${A} · e^(j · ${phaseDeg}°) = ${phasorReal.toFixed(4)} + j(${phasorImag.toFixed(4)})\n` +
                `• Real Part at t = 0:      Re{Ṽ} = ${A} · cos(${phaseDeg}°) = ${valAtZero.toFixed(4)}  [matches physical wave v(0)!]\n\n` +
                `Wave State at Time t = ${t}s:\n` +
                `• Dynamic Time Factor:     e^(jωt) with rotation angle ωt = ${(omega * t * 180 / Math.PI).toFixed(1)}°\n` +
                `• Ṽ · e^(jωt):             ${A} · e^(j · ${(totalArgRad * 180 / Math.PI).toFixed(1)}°) = ${complexReal.toFixed(4)} + j(${complexImag.toFixed(4)})\n` +
                `• Expanded Form:           ${A} · [cos(${(totalArgRad * 180 / Math.PI).toFixed(1)}°) + j·sin(${(totalArgRad * 180 / Math.PI).toFixed(1)}°)]\n` +
                `• Physical Wave v(t):      Re{Ṽ · e^(jωt)} = ${physicalVal.toFixed(4)}  [oscillating in bounds -${Math.abs(A)} to +${Math.abs(A)}]\n\n` +
                `Phasor Arithmetic & Rotations (with W = 2 · e^(j · 30°)):\n` +
                `• Multiplication (Ṽ · W):   (${A} · 2) · e^(j · (${phaseDeg}° + 30°)) = ${multMag.toFixed(4)} · e^(j · ${multAngleDeg.toFixed(1)}°)\n` +
                `                           → Multiplies amplitudes (${multMag.toFixed(2)}) & rotates counterclockwise (+30°)\n` +
                `• Division (Ṽ / W):         (${A} / 2) · e^(j · (${phaseDeg}° - 30°)) = ${divMag.toFixed(4)} · e^(j · ${divAngleDeg.toFixed(1)}°)\n` +
                `                           → Divides amplitudes (${divMag.toFixed(2)}) & subtracts angle (-30°, clockwise rotation)`;
        }

        function calculateLoadBoundaryReflection() {
            if (typeof globalThis.getTLRefelectionCoefficient !== 'function') {
                document.getElementById('boundary-eval-output').textContent = 'Error: globalThis.getTLRefelectionCoefficient is not defined!';
                return;
            }
            const zlReal = parseFloat(document.getElementById('boundary-zl-real').value);
            const zlImag = parseFloat(document.getElementById('boundary-zl-imag').value);
            const z0Mag = parseFloat(document.getElementById('boundary-z0').value);
            const v0plusMag = parseFloat(document.getElementById('boundary-v0plus-mag').value);
            const v0plusPhaseDeg = parseFloat(document.getElementById('boundary-v0plus-phase').value);

            const v0plusPhaseRad = v0plusPhaseDeg * Math.PI / 180;
            const v0plus = {
                real: v0plusMag * Math.cos(v0plusPhaseRad),
                imag: v0plusMag * Math.sin(v0plusPhaseRad)
            };

            // Calculate reflection coefficient using transmission_line.js API
            const reflResult = globalThis.getTLRefelectionCoefficient(zlReal, zlImag, z0Mag, 0);
            const gamma = reflResult.reflection;

            // Reflected wave phasor at load: V-(0) = Gamma * V+(0)
            const v0minus = globalThis.multiplyComplexNums(gamma.real, gamma.imag, v0plus.real, v0plus.imag);
            const v0minusMag = Math.hypot(v0minus.real, v0minus.imag);
            const v0minusPhaseDeg = Math.atan2(v0minus.imag, v0minus.real) * 180 / Math.PI;

            // Wave world: total line voltage V_TL(0) = V+(0) + V-(0)
            const vTotal = {
                real: v0plus.real + v0minus.real,
                imag: v0plus.imag + v0minus.imag
            };
            const vTotalMag = Math.hypot(vTotal.real, vTotal.imag);
            const vTotalPhaseDeg = Math.atan2(vTotal.imag, vTotal.real) * 180 / Math.PI;

            // Wave world currents: I+(0) = V+(0)/Z0, I-(0) = -V-(0)/Z0, I_total = (V+ - V-)/Z0
            const iTotal = {
                real: (v0plus.real - v0minus.real) / z0Mag,
                imag: (v0plus.imag - v0minus.imag) / z0Mag
            };
            const iTotalMag = Math.hypot(iTotal.real, iTotal.imag);

            // Circuit world: V_circuit = I_load * Z_L
            const vCircuit = globalThis.multiplyComplexNums(iTotal.real, iTotal.imag, zlReal, zlImag);
            const vCircuitMag = Math.hypot(vCircuit.real, vCircuit.imag);

            // Verification
            const diff = Math.hypot(vTotal.real - vCircuit.real, vTotal.imag - vCircuit.imag);
            const isMatch = diff < 1e-5;

            document.getElementById('boundary-eval-output').textContent = 
                `Wave World vs Circuit World Boundary Evaluation:\n` +
                `--------------------------------------------------\n` +
                `Line & Termination Configuration:\n` +
                `• Terminating Load Z_L:         ${zlReal} + j(${zlImag}) Ω\n` +
                `• Characteristic Impedance Z₀:  ${z0Mag} Ω (intrinsic wave impedance, not resistance!)\n` +
                `• Normalized Load z_L = Z_L/Z₀: ${reflResult.normalized_load_impedance.real.toFixed(4)} + j(${reflResult.normalized_load_impedance.imag.toFixed(4)})\n\n` +
                `Load Reflection Coefficient (from globalThis.getTLRefelectionCoefficient):\n` +
                `• Magnitude |Γ_L|:              ${gamma.magnitude.toFixed(4)}\n` +
                `• Phase Angle θ_Γ:              ${(gamma.theta * 180 / Math.PI).toFixed(2)}° (${gamma.theta.toFixed(4)} rad)\n` +
                `• Complex Γ_L:                  ${gamma.real.toFixed(4)} + j(${gamma.imag.toFixed(4)})\n\n` +
                `Wave World at the Load (d = 0):\n` +
                `• Incident Wave V⁺(0):          ${v0plus.real.toFixed(4)} + j(${v0plus.imag.toFixed(4)}) V  (|V⁺| = ${v0plusMag.toFixed(2)} V, θ = ${v0plusPhaseDeg}°)\n` +
                `• Reflected Wave V⁻(0) = Γ_L·V⁺: ${v0minus.real.toFixed(4)} + j(${v0minus.imag.toFixed(4)}) V  (|V⁻| = ${v0minusMag.toFixed(3)} V, θ = ${v0minusPhaseDeg.toFixed(2)}°)\n` +
                `• Wave Superposition V(0)=V⁺+V⁻: ${vTotal.real.toFixed(4)} + j(${vTotal.imag.toFixed(4)}) V  (|V_total| = ${vTotalMag.toFixed(3)} V, θ = ${vTotalPhaseDeg.toFixed(2)}°)\n` +
                `• Total Line Current I(0):      ${(iTotal.real * 1000).toFixed(3)} + j(${(iTotal.imag * 1000).toFixed(3)}) mA  (|I| = ${(iTotalMag * 1000).toFixed(3)} mA)\n\n` +
                `Circuit World at the Load:\n` +
                `• Circuit Voltage V_load = I·Z_L: ${vCircuit.real.toFixed(4)} + j(${vCircuit.imag.toFixed(4)}) V  (|V_load| = ${vCircuitMag.toFixed(3)} V)\n` +
                `• Boundary Continuity Match:     ${isMatch ? 'CONFIRMED! (V_wave === V_circuit)' : 'Difference: ' + diff.toExponential(3)}\n` +
                `  → The wave world superposition matches terminal Ohm\'s law identically!`;
        }

        function calculateStandingWaveRatioEnvelope() {

            const gamma = reflResult.reflection;

            // SWR via transmission_line.js utility

            const vPlusPeak = v0plusMag;
            const vMinusPeak = gammaMag * v0plusMag;

            // Envelope extrema across the line
            const vMax = vPlusPeak * (1 + gammaMag);
            const vMin = vPlusPeak * Math.max(0, 1 - gammaMag);

            const isMatched = Math.abs(gammaMag) < 1e-4;

            document.getElementById('swr-envelope-output').textContent =

                `--------------------------------------------------\n` +

                `Wave Amplitudes Along the Line:\n` +
                `• Forward Wave |V⁺| Peak:       ${vPlusPeak.toFixed(3)} V  (constant peak amplitude at EVERY point on line!)\n` +
                `• Reflected Wave |V⁻| Peak:     ${vMinusPeak.toFixed(3)} V  (constant peak amplitude at EVERY point on line!)\n\n` +
                `Standing Wave Voltage Envelope (Superposition V = V⁺ + V⁻):\n` +
                `• Max Envelope Peak (V_max):     ${vMax.toFixed(3)} V  [constructive: |V⁺| · (1 + |Γ_L|)]\n` +

                `Key Envelope Insight:\n` +

                    ? `• PERFECT MATCH (Γ_L = 0): V_max === V_min === ${vMax.toFixed(3)} V. SWR = 1.000.\n  The amplitude envelope is completely flat! Every point on the line oscillates to the exact same peak amplitude.`
                    : `• MISMATCHED LINE (|Γ_L| = ${gammaMag.toFixed(4)}): The amplitude envelope is NOT uniform.\n  Different points along the line reach different cycle peaks, ranging between ${vMin.toFixed(3)} V and ${vMax.toFixed(3)} V.\n  SWR (${typeof swrVal === 'number' ? swrVal.toFixed(4) : swrVal}) is the ratio of the tallest peak (${vMax.toFixed(3)} V) to the shortest peak (${vMin.toFixed(3)} V) over a full cycle.`

        function calculateLineImpedanceDerivation() {
            if (typeof globalThis.getTLRefelectionCoefficient !== 'function' ||
                typeof globalThis.getImpedanceAtDistanceFromLoad_lossless_TL !== 'function') {
                document.getElementById('line-z-output').textContent = 'Error: transmission_line.js API functions are not defined!';
                return;
            }
            const zlReal = parseFloat(document.getElementById('line-z-zl-real').value);
            const zlImag = parseFloat(document.getElementById('line-z-zl-imag').value);
            const z0Mag = parseFloat(document.getElementById('line-z-z0').value);
            const beta = parseFloat(document.getElementById('line-z-beta').value);
            const d = parseFloat(document.getElementById('line-z-dist').value);
            const testV0plus = parseFloat(document.getElementById('line-z-v0plus').value);

            // 1. Load Reflection Coefficient Gamma_L = (ZL - Z0)/(ZL + Z0)
            const reflResult = globalThis.getTLRefelectionCoefficient(zlReal, zlImag, z0Mag, 0);
            const gammaL = reflResult.reflection;

            // 2. Rotated reflection at distance d: Gamma(d) = Gamma_L * e^(-j * 2 * beta * d)
            const rotAngleRad = -2 * beta * d;
            const gammaDistTheta = gammaL.theta + rotAngleRad;
            const gammaDistReal = gammaL.magnitude * Math.cos(gammaDistTheta);
            const gammaDistImag = gammaL.magnitude * Math.sin(gammaDistTheta);

            // 3. Compute Z(d) via API function
            const zAtDist = globalThis.getImpedanceAtDistanceFromLoad_lossless_TL(d, gammaL, z0Mag, beta);

            // 4. Test explicit wave values with test incident amplitude V0+
            // V+(d) phasor = V0+ * e^(j * beta * d)
            const vPlusReal = testV0plus * Math.cos(beta * d);
            const vPlusImag = testV0plus * Math.sin(beta * d);

            // V-(d) phasor = V0+ * Gamma_L * e^(-j * beta * d)
            const vMinusPhasorTheta = gammaL.theta - beta * d;
            const vMinusReal = testV0plus * gammaL.magnitude * Math.cos(vMinusPhasorTheta);
            const vMinusImag = testV0plus * gammaL.magnitude * Math.sin(vMinusPhasorTheta);

            // Total V(d) = V+(d) + V-(d)
            const vTotalReal = vPlusReal + vMinusReal;
            const vTotalImag = vPlusImag + vMinusImag;
            const vTotalMag = Math.hypot(vTotalReal, vTotalImag);

            // Total I(d) = (V+(d) - V-(d)) / Z0
            const iTotalReal = (vPlusReal - vMinusReal) / z0Mag;
            const iTotalImag = (vPlusImag - vMinusImag) / z0Mag;
            const iTotalMag = Math.hypot(iTotalReal, iTotalImag);

            // Ratio V(d) / I(d)
            const zFromRatio = globalThis.divideComplexNums(vTotalReal, vTotalImag, iTotalReal, iTotalImag);

            // Phase rotation in degrees
            let phaseShiftDeg = ((2 * beta * d * 180 / Math.PI) % 360);
            if (phaseShiftDeg < 0) phaseShiftDeg += 360;

            document.getElementById('line-z-output').textContent = 
                `Transmission Line Impedance Derivation & Evaluation:\n` +
                `--------------------------------------------------\n` +
                `Inputs:\n` +
                `• Terminating Load Z_L:         ${zlReal} + j(${zlImag}) Ω\n` +
                `• Characteristic Impedance Z₀:  ${z0Mag} Ω\n` +
                `• Distance from Load d:         ${d} m (β = ${beta} rad/m, round-trip 2βd = ${(2 * beta * d).toFixed(3)} rad / ${phaseShiftDeg.toFixed(1)}°)\n\n` +
                `Step 1: Load Reflection Coefficient (Γ_L):\n` +
                `• Γ_L = (Z_L - Z₀)/(Z_L + Z₀):  ${gammaL.real.toFixed(4)} + j(${gammaL.imag.toFixed(4)})  [|Γ_L| = ${gammaL.magnitude.toFixed(4)}, θ = ${(gammaL.theta * 180 / Math.PI).toFixed(2)}°]\n\n` +
                `Step 2: Rotated Reflection Coefficient at Distance d:\n` +
                `• Γ(d) = Γ_L · e^(-j2βd):        ${gammaDistReal.toFixed(4)} + j(${gammaDistImag.toFixed(4)})  [|Γ(d)| = ${gammaL.magnitude.toFixed(4)}, rotated clockwise by ${(2 * beta * d * 180 / Math.PI).toFixed(1)}°]\n\n` +
                `Step 3: Impedance from Universal Formula Z(d) = Z₀ · [1 + Γ(d)] / [1 - Γ(d)]:\n` +
                `• Z(d) Real:                    ${zAtDist.real.toFixed(3)} Ω\n` +
                `• Z(d) Imag:                    ${zAtDist.imag.toFixed(3)} Ω\n` +
                `• Z(d) Magnitude:               ${zAtDist.magnitude.toFixed(3)} Ω  [Phase: ${(zAtDist.theta * 180 / Math.PI).toFixed(2)}°]\n\n` +
                `Step 4: Explicit V₀⁺ Cancellation Verification (using test |V₀⁺| = ${testV0plus} V):\n` +
                `• Total Voltage V(d) = V⁺ + V⁻: ${vTotalReal.toFixed(3)} + j(${vTotalImag.toFixed(3)}) V  (|V| = ${vTotalMag.toFixed(3)} V)\n` +
                `• Total Current I(d) = (V⁺-V⁻)/Z₀: ${(iTotalReal * 1000).toFixed(3)} + j(${(iTotalImag * 1000).toFixed(3)}) mA  (|I| = ${(iTotalMag * 1000).toFixed(3)} mA)\n` +
                `• Direct Ratio V(d) / I(d):     ${zFromRatio.real.toFixed(3)} + j(${zFromRatio.imag.toFixed(3)}) Ω\n` +
                `• Matches API Z(d) Formula?     CONFIRMED! (Difference = ${Math.hypot(zAtDist.real - zFromRatio.real, zAtDist.imag - zFromRatio.imag).toExponential(2)})\n` +
                `  → Proves V₀⁺ cancelled out identically: Z(d) is completely independent of generator amplitude!`;
        }

        function calculateGeneratorExcitationV0Plus() {
            if (typeof globalThis.get_generator_related_values_lossless_TL !== 'function' ||
                typeof globalThis.getTLRefelectionCoefficient !== 'function' ||
                typeof globalThis.getImpedanceAtDistanceFromLoad_lossless_TL !== 'function') {
                document.getElementById('gen-v0plus-output').textContent = 'Error: transmission_line.js functions not found!';
                return;
            }
            const vgMag = parseFloat(document.getElementById('gen-vg-mag').value);
            const vgPhaseDeg = parseFloat(document.getElementById('gen-vg-phase').value);
            const zgReal = parseFloat(document.getElementById('gen-zg-real').value);
            const zgImag = parseFloat(document.getElementById('gen-zg-imag').value);
            const length = parseFloat(document.getElementById('gen-line-length').value);
            const beta = parseFloat(document.getElementById('gen-beta').value);
            const z0 = parseFloat(document.getElementById('gen-z0').value);
            const zlReal = parseFloat(document.getElementById('gen-zl-real').value);
            const zlImag = parseFloat(document.getElementById('gen-zl-imag').value);

            const vgPhaseRad = vgPhaseDeg * Math.PI / 180;
            const vgReal = vgMag * Math.cos(vgPhaseRad);
            const vgImag = vgMag * Math.sin(vgPhaseRad);

            // 1. Reflection coefficient at load
            const reflResult = globalThis.getTLRefelectionCoefficient(zlReal, zlImag, z0, 0);
            const reflection = reflResult.reflection;

            // 2. Input impedance Z(l) at generator terminal (d = l)
            const zIn = globalThis.getImpedanceAtDistanceFromLoad_lossless_TL(length, reflection, z0, beta);

            // 3. Voltage division ratio: V_div = Z(l) / (Z(l) + Z_g)
            const zSumReal = zIn.real + zgReal;
            const zSumImag = zIn.imag + zgImag;
            const vDivRatio = globalThis.divideComplexNums(zIn.real, zIn.imag, zSumReal, zSumImag);

            // Terminal voltage into line at generator: V(l) = V_g * vDivRatio
            const vIntoTlReal = vgReal * vDivRatio.real - vgImag * vDivRatio.imag;
            const vIntoTlImag = vgReal * vDivRatio.imag + vgImag * vDivRatio.real;
            const vIntoTlMag = Math.hypot(vIntoTlReal, vIntoTlImag);
            const vIntoTlPhaseDeg = Math.atan2(vIntoTlImag, vIntoTlReal) * 180 / Math.PI;

            // 4. Wave denominator factor: e^(j*beta*l) + Gamma_L * e^(-j*beta*l)
            const v0plusRatio = globalThis.get_voltage_as_v0plus_ratio_at_distance_from_load_lossless_TL(length, reflection, beta);

            // 5. Compute V0+ using transmission_line.js library function
            const v0plus = globalThis.get_generator_related_values_lossless_TL(
                length,
                vgReal,
                vgImag,
                zgReal,
                zgImag,
                reflection,
                z0,
                beta
            );

            // Forward and backward wave phasors at generator distance d = l
            const vPlusAtLReal = v0plus.magnitude * Math.cos(v0plus.theta + beta * length);
            const vPlusAtLImag = v0plus.magnitude * Math.sin(v0plus.theta + beta * length);

            const vMinusPhase = v0plus.theta + reflection.theta - beta * length;
            const vMinusAtLReal = v0plus.magnitude * reflection.magnitude * Math.cos(vMinusPhase);
            const vMinusAtLImag = v0plus.magnitude * reflection.magnitude * Math.sin(vMinusPhase);

            const vWaveTotalAtLReal = vPlusAtLReal + vMinusAtLReal;
            const vWaveTotalAtLImag = vPlusAtLImag + vMinusAtLImag;

            const diff = Math.hypot(vIntoTlReal - vWaveTotalAtLReal, vIntoTlImag - vWaveTotalAtLImag);

            document.getElementById('gen-v0plus-output').textContent = 
                `Generator Excitation & V₀⁺ Derivation Results:\n` +
                `--------------------------------------------------\n` +
                `Step 1: Impedance at Generator Terminal d = l (${length} m):\n` +
                `• Input Impedance Z(l):         ${zIn.real.toFixed(3)} + j(${zIn.imag.toFixed(3)}) Ω  (|Z| = ${zIn.magnitude.toFixed(3)} Ω)\n` +
                `• Generator Internal Z_g:       ${zgReal} + j(${zgImag}) Ω\n\n` +
                `Step 2: Circuit World Voltage Division:\n` +
                `• Voltage Division Ratio:       ${vDivRatio.real.toFixed(4)} + j(${vDivRatio.imag.toFixed(4)})  [Z(l) / (Z(l) + Z_g)]\n` +
                `• Terminal Voltage V(l):        ${vIntoTlReal.toFixed(3)} + j(${vIntoTlImag.toFixed(3)}) V  (|V(l)| = ${vIntoTlMag.toFixed(3)} V, θ = ${vIntoTlPhaseDeg.toFixed(2)}°)\n\n` +
                `Step 3: Wave World Denominator Factor:\n` +
                `• e^(jβl) + Γ_L·e^(-jβl):        ${v0plusRatio.v_to_v0plus_ratio_real.toFixed(4)} + j(${v0plusRatio.v_to_v0plus_ratio_imag.toFixed(4)})\n\n` +
                `Step 4: Computed Incident Wave Phasor V₀⁺:\n` +
                `• V₀⁺ = |V₀⁺| · e^(jθ⁺):        ${v0plus.real.toFixed(3)} + j(${v0plus.imag.toFixed(3)}) V\n` +
                `• Magnitude |V₀⁺|:              ${v0plus.magnitude.toFixed(3)} V\n` +
                `• Phase Angle θ⁺:               ${(v0plus.theta * 180 / Math.PI).toFixed(2)}° (${v0plus.theta.toFixed(4)} rad)\n\n` +
                `Verification (Boundary Continuity at d = l):\n` +
                `• Forward Wave at Gen V⁺(l):    ${vPlusAtLReal.toFixed(3)} + j(${vPlusAtLImag.toFixed(3)}) V\n` +
                `• Backward Wave at Gen V⁻(l):   ${vMinusAtLReal.toFixed(3)} + j(${vMinusAtLImag.toFixed(3)}) V\n` +
                `• Wave Sum V⁺(l) + V⁻(l):       ${vWaveTotalAtLReal.toFixed(3)} + j(${vWaveTotalAtLImag.toFixed(3)}) V\n` +
                `• Circuit Voltage V(l):         ${vIntoTlReal.toFixed(3)} + j(${vIntoTlImag.toFixed(3)}) V\n` +
                `• Boundary Match Check:         ${diff < 1e-5 ? 'CONFIRMED! (V_circuit === V_wave)' : 'Diff: ' + diff.toExponential(2)}\n\n` +
                `Time Advancement Note:\n` +
                `• Phasor V₀⁺ represents state at t = 0.\n` +
                `• For any future time t, multiply by e^(jωt) to rotate by ωt radians in the complex plane.`;
        }

        // --- Global references for Chart.js instances & simulation cache ---
        let tlChartInstance = null;
        let tlPhasorChartInstance = null;
        let lastSimResult = null;

        function setDemoPreset(z0, zlR, zlI, zsR, zsI, vgM, vgP, len, betaVal) {
            document.getElementById('demo-z0').value = z0;
            document.getElementById('demo-zl-real').value = zlR;
            document.getElementById('demo-zl-imag').value = zlI;
            document.getElementById('demo-zs-real').value = zsR;
            document.getElementById('demo-zs-imag').value = zsI;
            document.getElementById('demo-vg-mag').value = vgM;
            document.getElementById('demo-vg-phase').value = vgP;
            document.getElementById('demo-line-length').value = len;
            document.getElementById('demo-beta').value = betaVal;
            runFullTransmissionLineDemo();
        }

        function runFullTransmissionLineDemo() {
            if (typeof globalThis.getTLRefelectionCoefficient !== 'function' ||
                typeof globalThis.get_generator_related_values_lossless_TL !== 'function' ||
                typeof globalThis.get_voltage_as_v0plus_ratio_at_distance_from_load_lossless_TL !== 'function') {
                const outEl = document.getElementById('demo-output');
                if (outEl) outEl.textContent = 'Error: transmission_line.js functions not found!';
                return;
            }

            const z0 = parseFloat(document.getElementById('demo-z0').value);
            const zlReal = parseFloat(document.getElementById('demo-zl-real').value);
            const zlImag = parseFloat(document.getElementById('demo-zl-imag').value);
            const zsReal = parseFloat(document.getElementById('demo-zs-real').value);
            const zsImag = parseFloat(document.getElementById('demo-zs-imag').value);
            const vgMag = parseFloat(document.getElementById('demo-vg-mag').value);
            const vgPhaseDeg = parseFloat(document.getElementById('demo-vg-phase').value);
            const length = parseFloat(document.getElementById('demo-line-length').value);
            const beta = parseFloat(document.getElementById('demo-beta').value);

            const vgPhaseRad = vgPhaseDeg * Math.PI / 180;
            const vgReal = vgMag * Math.cos(vgPhaseRad);
            const vgImag = vgMag * Math.sin(vgPhaseRad);

            // Step 1: Find reflection at load (getTLRefelectionCoefficient)
            const reflResult = globalThis.getTLRefelectionCoefficient(zlReal, zlImag, z0, 0);
            const reflection = reflResult.reflection;

            // Step 2: Use get_generator_related_values_lossless_TL to solve for V0+
            const v0plus = globalThis.get_generator_related_values_lossless_TL(
                length,
                vgReal,
                vgImag,
                zsReal,
                zsImag,
                reflection,
                z0,
                beta
            );

            // Step 3: Voltage at d = 0 (load) and d = length (generator) via ratio helper
            const ratioAtLoad = globalThis.get_voltage_as_v0plus_ratio_at_distance_from_load_lossless_TL(0, reflection, beta);
            const vAtLoad = globalThis.multiplyComplexNums(
                v0plus.real, v0plus.imag,
                ratioAtLoad.v_to_v0plus_ratio_real, ratioAtLoad.v_to_v0plus_ratio_imag
            );
            const vAtLoadMag = Math.hypot(vAtLoad.real, vAtLoad.imag);
            const vAtLoadPhaseDeg = Math.atan2(vAtLoad.imag, vAtLoad.real) * 180 / Math.PI;

            const ratioAtGen = globalThis.get_voltage_as_v0plus_ratio_at_distance_from_load_lossless_TL(length, reflection, beta);
            const vAtGen = globalThis.multiplyComplexNums(
                v0plus.real, v0plus.imag,
                ratioAtGen.v_to_v0plus_ratio_real, ratioAtGen.v_to_v0plus_ratio_imag
            );
            const vAtGenMag = Math.hypot(vAtGen.real, vAtGen.imag);
            const vAtGenPhaseDeg = Math.atan2(vAtGen.imag, vAtGen.real) * 180 / Math.PI;

            // Step 4: Sample 101 points along the line
            const numPoints = 101;
            const xPositions = [];
            const voltageMagnitudes = [];
            const forwardWaveMags = [];
            const reflectedWaveMags = [];
            const totalReals = [];
            const forwardReals = [];
            const reflectedReals = [];

            for (let i = 0; i < numPoints; i++) {
                const dist = (i / (numPoints - 1)) * length; // 0 (load) to length (generator)
                const ptRatio = globalThis.get_voltage_as_v0plus_ratio_at_distance_from_load_lossless_TL(dist, reflection, beta);

                // Total V(dist) = V0+ * ptRatio
                const vPt = globalThis.multiplyComplexNums(
                    v0plus.real, v0plus.imag,
                    ptRatio.v_to_v0plus_ratio_real, ptRatio.v_to_v0plus_ratio_imag
                );
                const vPtMag = Math.hypot(vPt.real, vPt.imag);
                const vPtReal = vPt.real; // Instantaneous wave value at t=0

                // Forward wave at distance dist: V+(dist) = V0+ * e^(j*beta*dist)
                const fwdAngle = v0plus.theta + beta * dist;
                const vFwdReal = v0plus.magnitude * Math.cos(fwdAngle);

                // Reflected wave at distance dist: V-(dist) = V0+ * Gamma_L * e^(-j*beta*dist)
                const refAngle = v0plus.theta + reflection.theta - beta * dist;
                const vRefReal = v0plus.magnitude * reflection.magnitude * Math.cos(refAngle);

                xPositions.push(dist.toFixed(3));
                voltageMagnitudes.push(vPtMag);
                forwardWaveMags.push(v0plus.magnitude);
                reflectedWaveMags.push(v0plus.magnitude * reflection.magnitude);
                totalReals.push(vPtReal);
                forwardReals.push(vFwdReal);
                reflectedReals.push(vRefReal);
            }

            // Cache simulation results
            lastSimResult = {
                z0,
                zlReal,
                zlImag,
                zsReal,
                zsImag,
                vgMag,
                vgPhaseDeg,
                length,
                beta,
                reflection,
                v0plus,
                vAtLoad,
                vAtLoadMag,
                vAtLoadPhaseDeg,
                vAtGen,
                vAtGenMag,
                vAtGenPhaseDeg,
                numPoints,
                xPositions,
                voltageMagnitudes,
                forwardWaveMags,
                reflectedWaveMags,
                totalReals,
                forwardReals,
                reflectedReals
            };

            // Render both charts according to current checkbox states
            updateChartRender();

            // Display formatted text output
            const isMatched = reflection.magnitude < 1e-4;
            const outEl = document.getElementById('demo-output');
            if (outEl) {
                outEl.textContent = 
                    `Full Transmission Line End-to-End Simulation Output:\n` +
                    `--------------------------------------------------\n` +
                    `Line & Termination Setup:\n` +
                    `• Characteristic Impedance Z₀:  ${z0.toFixed(2)} Ω\n` +
                    `• Terminating Load Z_L:         ${zlReal.toFixed(2)} + j(${zlImag.toFixed(2)}) Ω\n` +
                    `• Source Impedance Z_source:    ${zsReal.toFixed(2)} + j(${zsImag.toFixed(2)}) Ω\n` +
                    `• Generator Voltage V_g:        ${vgMag.toFixed(3)} V ∠ ${vgPhaseDeg.toFixed(1)}°\n` +
                    `• Physical Length l:            ${length.toFixed(2)} m (β = ${beta.toFixed(3)} rad/m, βl = ${(beta * length).toFixed(3)} rad)\n\n` +
                    `Step 1: Load Reflection Coefficient (via getTLRefelectionCoefficient):\n` +
                    `• Reflection |Γ_L|:              ${reflection.magnitude.toFixed(4)}\n` +
                    `• Reflection Phase θ_Γ:          ${(reflection.theta * 180 / Math.PI).toFixed(2)}° (${reflection.theta.toFixed(4)} rad)\n` +
                    `• Complex Γ_L:                  ${reflection.real.toFixed(4)} + j(${reflection.imag.toFixed(4)})\n\n` +
                    `Step 2: Incident Wave Phasor V₀⁺ (via get_generator_related_values_lossless_TL):\n` +
                    `• Magnitude |V₀⁺|:              ${v0plus.magnitude.toFixed(4)} V\n` +
                    `• Phase Angle θ⁺:               ${(v0plus.theta * 180 / Math.PI).toFixed(2)}°\n` +
                    `• Complex V₀⁺:                  ${v0plus.real.toFixed(4)} + j(${v0plus.imag.toFixed(4)}) V\n\n` +
                    `Step 3: Boundary Values at Load & Generator:\n` +
                    `• At Load (d = 0):              Peak Envelope |V| = ${vAtLoadMag.toFixed(4)} V, Instantaneous at t=0 v(0,0) = ${vAtLoad.real.toFixed(4)} V\n` +
                    `• At Generator (d = ${length}m):     Peak Envelope |V| = ${vAtGenMag.toFixed(4)} V, Instantaneous at t=0 v(l,0) = ${vAtGen.real.toFixed(4)} V\n\n` +
                    `Step 4: Dual Chart Visualization Status:\n` +
                    `• Chart 1 (Peak Envelope across all times): |V(d)| envelope ripples between ${Math.min(...voltageMagnitudes).toFixed(4)} V and ${Math.max(...voltageMagnitudes).toFixed(4)} V.\n` +
                    `• Chart 2 (Instantaneous at t=0): v(d, 0) oscillates between ${Math.min(...totalReals).toFixed(4)} V and ${Math.max(...totalReals).toFixed(4)} V, strictly bounded by the dotted envelope.\n` +
                    (isMatched
                        ? `• Matched condition (Z_L = Z₀): Flat peak envelope at |V| = ${vAtLoadMag.toFixed(4)} V across the entire line!`
                        : `• Mismatch condition (|Γ_L| = ${reflection.magnitude.toFixed(4)}): Standing wave pattern clearly established.`
                    );
            }
        }

        // --- Thevenin Reduction & Simulation Helpers ---
        function setTheveninPreset(z0, zlR, zlI, l1, l2, rMid) {
            document.getElementById('th-z0').value = z0;
            document.getElementById('th-zl-real').value = zlR;
            document.getElementById('th-zl-imag').value = zlI;
            document.getElementById('th-tl1-len').value = l1;
            document.getElementById('th-tl2-len').value = l2;
            document.getElementById('th-rmid').value = rMid;
            calculateTheveninEquivalentDemo();
        }

        function calculateTheveninEquivalentDemo() {
            if (typeof globalThis.find_thevenin_equivalent_circuit !== 'function' ||
                typeof globalThis.getTLRefelectionCoefficient !== 'function') {
                const outEl = document.getElementById('thevenin-output');
                if (outEl) outEl.textContent = 'Error: find_thevenin_equivalent_circuit not found in radio_frequency_electric_circuit_calculator.js!';
                return;
            }

            const vgMag = parseFloat(document.getElementById('th-vg-mag').value);
            const zgReal = parseFloat(document.getElementById('th-zg-real').value);
            const z0 = parseFloat(document.getElementById('th-z0').value);
            const beta = parseFloat(document.getElementById('th-beta').value);
            const l1 = parseFloat(document.getElementById('th-tl1-len').value);
            const l2 = parseFloat(document.getElementById('th-tl2-len').value);
            const rMid = parseFloat(document.getElementById('th-rmid').value);
            const zlReal = parseFloat(document.getElementById('th-zl-real').value);
            const zlImag = parseFloat(document.getElementById('th-zl-imag').value);

            // Generator object formatted for API function
            const generator = {
                generator_distance: l1 + l2,
                generator_tl1_length: l1,
                generator_tl2_length: l2,
                generator_voltage_real: vgMag,
                generator_voltage_imag: 0,
                generator_impedance_real: zgReal,
                generator_impedance_imag: 0
            };

            // Load reflection coefficient
            const reflResult = globalThis.getTLRefelectionCoefficient(zlReal, zlImag, z0, 0);
            const reflectionLoad = reflResult.reflection;

            // Execute find_thevenin_equivalent_circuit from project API
            const theveninResult = globalThis.find_thevenin_equivalent_circuit(generator, reflectionLoad, z0, beta);

            const tl1Th = theveninResult.tl1_and_generator_equivalent;
            const tl2Th = theveninResult.tl2_and_load_equivalent;

            const vTh1Mag = Math.hypot(tl1Th.voltage_real, tl1Th.voltage_imag);
            const vTh1PhaseDeg = Math.atan2(tl1Th.voltage_imag, tl1Th.voltage_real) * 180 / Math.PI;

            const zTh1Mag = Math.hypot(tl1Th.z_real, tl1Th.z_imag);
            const zTh1PhaseDeg = Math.atan2(tl1Th.z_imag, tl1Th.z_real) * 180 / Math.PI;

            const zTh2Mag = Math.hypot(tl2Th.z_real, tl2Th.z_imag);
            const zTh2PhaseDeg = Math.atan2(tl2Th.z_imag, tl2Th.z_real) * 180 / Math.PI;

            // Reduced Lumped Circuit Analysis:
            // Single mesh loop: V_th1 in series with Z_th1, R_mid, and Z_th2 to ground
            const totalMeshZReal = tl1Th.z_real + rMid + tl2Th.z_real;
            const totalMeshZImag = tl1Th.z_imag + tl2Th.z_imag;

            // Mesh Current I = V_th1 / (Z_th1 + R_mid + Z_th2)
            const currentI = globalThis.divideComplexNums(
                tl1Th.voltage_real, tl1Th.voltage_imag,
                totalMeshZReal, totalMeshZImag
            );
            const currentIMag = Math.hypot(currentI.real, currentI.imag);

            // Node L1 voltage: V(L1) = V_th1 - I * Z_th1
            const dropZth1 = globalThis.multiplyComplexNums(currentI.real, currentI.imag, tl1Th.z_real, tl1Th.z_imag);
            const vL1 = {
                real: tl1Th.voltage_real - dropZth1.real,
                imag: tl1Th.voltage_imag - dropZth1.imag
            };
            const vL1Mag = Math.hypot(vL1.real, vL1.imag);

            // Node L2 voltage: V(L2) = I * Z_th2
            const vL2 = globalThis.multiplyComplexNums(currentI.real, currentI.imag, tl2Th.z_real, tl2Th.z_imag);
            const vL2Mag = Math.hypot(vL2.real, vL2.imag);

            const isContinuous = Math.abs(rMid) < 1e-4;

            document.getElementById('thevenin-output').textContent = 
                `Thevenin Equivalent & Lumped Circuit Simulation Output:\n` +
                `--------------------------------------------------\n` +
                `System Configuration:\n` +
                `• Generator:                    V_g = ${vgMag.toFixed(3)} V, Z_g = ${zgReal.toFixed(2)} Ω\n` +
                `• Transmission Line 1 (TL1):    Length l₁ = ${l1.toFixed(2)} m, Z₀ = ${z0.toFixed(2)} Ω, β = ${beta.toFixed(3)} rad/m\n` +
                `• Intermediate Component:       Series Resistor R_mid = ${rMid.toFixed(2)} Ω (connecting node L1 to L2)\n` +
                `• Transmission Line 2 (TL2):    Length l₂ = ${l2.toFixed(2)} m, Z₀ = ${z0.toFixed(2)} Ω\n` +
                `• Load:                         Z_L = ${zlReal.toFixed(2)} + j(${zlImag.toFixed(2)}) Ω\n\n` +
                `Left-Side Thevenin Equivalent at Node L1 (Replacing Generator + TL1):\n` +
                `• Open-Circuit Voltage V_th,1:  ${tl1Th.voltage_real.toFixed(4)} + j(${tl1Th.voltage_imag.toFixed(4)}) V  (|V_th,1| = ${vTh1Mag.toFixed(4)} V, θ = ${vTh1PhaseDeg.toFixed(2)}°)\n` +
                `• Thevenin Impedance Z_th,1:    ${tl1Th.z_real.toFixed(3)} + j(${tl1Th.z_imag.toFixed(3)}) Ω  (|Z_th,1| = ${zTh1Mag.toFixed(3)} Ω, θ = ${zTh1PhaseDeg.toFixed(2)}°)\n\n` +
                `Right-Side Thevenin Equivalent at Node L2 (Replacing TL2 + Load):\n` +

            const zPort1Analytic = globalThis.get_parallel_series_parallel_equivalent_z(

        function calculateS21ParameterDemo() {
            if (typeof globalThis.get_parallel_series_parallel_equivalent_z !== 'function' ||
                typeof globalThis.find_pre_two_port_impedance_current_voltage !== 'function' ||
                typeof globalThis.get_voltage_across_load_with_parallel_series_parallel_two_port_z !== 'function' ||
                typeof globalThis.getTLRefelectionCoefficient !== 'function') {
                const outEl = document.getElementById('s21-output');
                if (outEl) outEl.textContent = 'Error: radio_frequency_electric_circuit_calculator.js functions not found!';
                return;
            }

            const z0 = parseFloat(document.getElementById('s21-z0').value);
            const vg = parseFloat(document.getElementById('s21-vg-mag').value);
            const zgReal = parseFloat(document.getElementById('s21-zg-real').value);

            const zPre = {
                real: parseFloat(document.getElementById('s21-zpre-real').value),
                imag: parseFloat(document.getElementById('s21-zpre-imag').value)
            };
            const zSeries = {
                real: parseFloat(document.getElementById('s21-zseries-real').value),
                imag: parseFloat(document.getElementById('s21-zseries-imag').value)
            };
            const zPost = {
                real: parseFloat(document.getElementById('s21-zpost-real').value),
                imag: parseFloat(document.getElementById('s21-zpost-imag').value)
            };

            const matchedLoadAtPort2 = { z_real: z0, z_imag: 0 };

            // 1. Z(port 1) and S11
            const zPort1 = globalThis.get_parallel_series_parallel_equivalent_z(
                zPre,
                zSeries,
                zPost,
                matchedLoadAtPort2
            );
            const s11 = globalThis.getTLRefelectionCoefficient(zPort1.real, zPort1.imag, z0, 0).reflection;

            // 2. Simulate terminal voltage V1 and current I1 with generator
            const genEquivalent = {
                z_real: zgReal,
                z_imag: 0,
                voltage_real: vg,
                voltage_imag: 0
            };
            const simResults = globalThis.find_pre_two_port_impedance_current_voltage(genEquivalent, zPort1);
            const v1 = simResults.voltage_pre_two_port;
            const i1 = simResults.generator_current;

            // 3. Simulate voltage V2 across the matched load at Port 2
            const v2 = globalThis.get_voltage_across_load_with_parallel_series_parallel_two_port_z(
                i1, v1, zPre, zSeries, zPost, z0
            );

            // 4. Wave variables via zero-length TL concept
            const sqrtZ0 = Math.sqrt(z0);
            const onePlusS11 = { real: 1 + s11.real, imag: s11.imag };

            // a1 = (V1 / sqrt(Z0)) / (1 + S11)
            const v1Plus = globalThis.divideComplexNums(v1.real, v1.imag, onePlusS11.real, onePlusS11.imag);
            const a1 = {
                real: v1Plus.real / sqrtZ0,
                imag: v1Plus.imag / sqrtZ0,
                magnitude: Math.hypot(v1Plus.real, v1Plus.imag) / sqrtZ0
            };

            // b2 = V2 / sqrt(Z0)
            const b2 = {
                real: v2.real / sqrtZ0,
                imag: v2.imag / sqrtZ0,
                magnitude: Math.hypot(v2.real, v2.imag) / sqrtZ0
            };

            // 5. S21 = (V2 / V1) * (1 + S11)
            const v2OverV1 = globalThis.divideComplexNums(v2.real, v2.imag, v1.real, v1.imag);
            const s21 = globalThis.multiplyComplexNums(v2OverV1.real, v2OverV1.imag, onePlusS11.real, onePlusS11.imag);
            const s21Mag = Math.hypot(s21.real, s21.imag);
            const s21PhaseDeg = Math.atan2(s21.imag, s21.real) * 180 / Math.PI;

            // Power metrics
            const powerGainLinear = s21Mag * s21Mag;
            const s21Db = s21Mag > 0 ? (20 * Math.log10(s21Mag)) : -Infinity;

            // Verification against find_S_params from calculator
            let apiComparisonText = '';
            if (typeof globalThis.find_S_params === 'function') {
                try {
                    const genObj = {
                        generator_distance: 1,
                        generator_tl1_length: 0.5,
                        generator_tl2_length: 0.5,
                        generator_voltage_real: 1.0,
                        generator_voltage_imag: 0,
                        generator_impedance_real: 50,
                        generator_impedance_imag: 0
                    };
                    const sParamsObj = globalThis.find_S_params(genObj, zPre, zSeries, zPost, z0, 3.14159);
                    const s21Api = sParamsObj.S21;
                    const diffS21 = Math.hypot(s21.real - s21Api.real, s21.imag - s21Api.imag);
                    apiComparisonText = `• Verified vs find_S_params:    ${diffS21 < 1e-4 ? 'CONFIRMED! (Difference = ' + diffS21.toExponential(2) + ')' : 'Diff: ' + diffS21.toExponential(2)}`;
                } catch (e) {
                    apiComparisonText = '• find_S_params verification: ' + e.message;
                }
            }

            document.getElementById('s21-output').textContent = 
                `S₂₁ Forward Transmission Computation & Wave Analysis:\n` +
                `--------------------------------------------------\n` +
                `Network & Port Configuration:\n` +
                `• Reference Characteristic Z₀:  ${z0.toFixed(2)} Ω\n` +
                `• Pre-Series Shunt Z_p1:        ${zPre.real.toFixed(2)} + j(${zPre.imag.toFixed(2)}) Ω\n` +
                `• Series Branch Z_series:       ${zSeries.real.toFixed(2)} + j(${zSeries.imag.toFixed(2)}) Ω\n` +
                `• Post-Series Shunt Z_p2:       ${zPost.real.toFixed(2)} + j(${zPost.imag.toFixed(2)}) Ω\n` +
                `• Port 2 Matched Load:          Z_load2 = Z₀ = ${z0.toFixed(2)} Ω  (a₂ = 0, no reflections from load!)\n\n` +
                `Step 1: Input Port 1 Analysis:\n` +
                `• Input Impedance Z(port 1):    ${zPort1.real.toFixed(3)} + j(${zPort1.imag.toFixed(3)}) Ω\n` +
                `• Input Reflection S₁₁:         ${s11.real.toFixed(4)} + j(${s11.imag.toFixed(4)})  [|S₁₁| = ${s11.magnitude.toFixed(4)}, θ = ${(s11.theta * 180 / Math.PI).toFixed(2)}°]\n` +
                `• Boundary Factor (1 + S₁₁):    ${onePlusS11.real.toFixed(4)} + j(${onePlusS11.imag.toFixed(4)})\n\n` +
                `Step 2: Simulated Terminal Voltages (Vg = ${vg} V, Zsource = ${zgReal} Ω):\n` +
                `• Voltage at Port 1 V(L1):      ${v1.real.toFixed(4)} + j(${v1.imag.toFixed(4)}) V  (|V₁| = ${Math.hypot(v1.real, v1.imag).toFixed(4)} V)\n` +
                `• Voltage at Port 2 V(L2):      ${v2.real.toFixed(4)} + j(${v2.imag.toFixed(4)}) V  (|V₂| = ${Math.hypot(v2.real, v2.imag).toFixed(4)} V)\n` +
                `• Voltage Gain Ratio V₂ / V₁:   ${v2OverV1.real.toFixed(4)} + j(${v2OverV1.imag.toFixed(4)})  (|V₂/V₁| = ${Math.hypot(v2OverV1.real, v2OverV1.imag).toFixed(4)})\n\n` +
                `Step 3: Power Waves via Zero-Length Line Concept:\n` +
                `• Forward Incident a₁ = V₁⁺/√Z₀: ${a1.real.toFixed(4)} + j(${a1.imag.toFixed(4)}) √W  (|a₁| = ${a1.magnitude.toFixed(4)} √W, |V₁⁺| = ${Math.hypot(v1Plus.real, v1Plus.imag).toFixed(4)} V)\n` +
                `• Transmitted Wave b₂ = V₂/√Z₀:  ${b2.real.toFixed(4)} + j(${b2.imag.toFixed(4)}) √W  (|b₂| = ${b2.magnitude.toFixed(4)} √W)\n\n` +
                `Step 4: Forward Transmission Coefficient S₂₁ = [V₂ / V₁] · (1 + S₁₁) = b₂ / a₁:\n` +
                `• Complex S₂₁:                  ${s21.real.toFixed(4)} + j(${s21.imag.toFixed(4)})\n` +
                `• Magnitude |S₂₁|:              ${s21Mag.toFixed(4)}\n` +
                `• Phase Angle θ(S₂₁):           ${s21PhaseDeg.toFixed(2)}° (${(s21PhaseDeg * Math.PI / 180).toFixed(4)} rad)\n` +
                `• Insertion Gain / Loss:        ${s21Db.toFixed(2)} dB  [20 · log₁₀(|S₂₁|)]\n` +
                `• Linear Power Gain |S₂₁|²:     ${powerGainLinear.toFixed(4)}  (Transmits ${(powerGainLinear * 100).toFixed(2)}% of incident power to load)\n` +
                (apiComparisonText ? apiComparisonText + '\n' : '') +
                `\nSource Independence Note:\n` +
                `• Changing Vg or Zsource alters V₁ and V₂, but their quotient V₂/V₁ and S₂₁ remain strictly invariant!`;
        }
